version: '3.9'

services:
  postgres:
    image: postgres:14
    container_name: books_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-books}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    # Опубликованный порт Docker обходит firewalld — дефолт обязан быть 127.0.0.1
    # (LEGACY-071). Прежний '${POSTGRES_PORT:-5432}:5432' биндил на все интерфейсы
    # в любой среде, поднятой из репозитория без .env.
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: books_redis
    restart: unless-stopped
    # LEGACY-071: порт 6379 пять недель смотрел в интернет без пароля, зафиксирована
    # попытка RCE через `CONFIG SET dir`. Дефолт биндится на loopback, пароль обязателен.
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    # `:?` намеренно: без REDIS_PASSWORD контейнер не поднимется. Тихий запуск без
    # пароля — ровно тот сценарий, который и привёл к инциденту. Секрет живёт в
    # env-файле (`.env` локально, `.env.prod` на VPS), не в compose.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      [
        'redis-server',
        '--appendonly',
        'no',
        '--requirepass',
        '${REDIS_PASSWORD:?REDIS_PASSWORD is required}',
      ]
    # CMD-SHELL, а не CMD: в exec-форме $REDIS_PASSWORD не разворачивается.
    # REDISCLI_AUTH, а не `-a`: `-a` кладёт пароль в argv (виден в `ps`) и пишет
    # предупреждение в stderr. `| grep -q PONG`, а не голый ping: redis-cli умеет
    # напечатать ошибку и выйти с нулевым кодом — такая проба не способна покраснеть.
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
