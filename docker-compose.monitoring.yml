# Стек мониторинга (LEGACY-095: до 10.08.2026 не был развёрнут вовсе).
#
# ⚠️ Все порты публикуются **только на 127.0.0.1**. Prometheus, Grafana и
# Alertmanager не имеют собственной защиты, пригодной для открытого интернета,
# а этот сервер уже получал попытку RCE через опубликованный наружу Redis без
# пароля (`LEGACY-071`). Доступ к интерфейсам — через SSH-туннель:
#   ssh -L 9090:127.0.0.1:9090 -L 3000:127.0.0.1:3000 deploy@ssh.bibliaris.com

services:
  prometheus:
    image: prom/prometheus:v2.45.1
    container_name: books-prometheus
    ports:
      - '127.0.0.1:${PROMETHEUS_PORT:-9090}:9090'
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./configs/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - ./configs/recording_rules.yml:/etc/prometheus/recording_rules.yml:ro
      - ./configs/metrics_token:/etc/prometheus/metrics_token:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=14d'
      - '--storage.tsdb.retention.size=2GB'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - monitoring
      - books-network
    depends_on:
      - node-exporter

  grafana:
    image: grafana/grafana:10.1.5
    container_name: books-grafana
    ports:
      - '127.0.0.1:${GRAFANA_PORT:-3000}:3000'
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin123}
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
      - GF_SERVER_DOMAIN=${GRAFANA_DOMAIN:-localhost}
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:3000}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./configs/grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped
    networks:
      - monitoring
    depends_on:
      - prometheus

  node-exporter:
    image: prom/node-exporter:v1.6.1
    container_name: books-node-exporter
    ports:
      - '127.0.0.1:${NODE_EXPORTER_PORT:-9100}:9100'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    restart: unless-stopped
    networks:
      - monitoring

  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: books-alertmanager
    ports:
      - '127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093'
    volumes:
      - ./configs/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://localhost:9093'
    restart: unless-stopped
    networks:
      - monitoring
    depends_on:
      - prometheus

volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  alertmanager_data:
    driver: local

networks:
  monitoring:
    driver: bridge
  # Сеть приложения: Prometheus скребёт его по внутреннему имени `app:5000`,
  # маршрут метрик наружу не публикуется.
  books-network:
    external: true
    name: ${APP_NETWORK:-src_default}
