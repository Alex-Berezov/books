# Стек мониторинга (LEGACY-095: до 10.08.2026 не был развёрнут вовсе).
#
# ⚠️ Все порты публикуются **только на 127.0.0.1**. Prometheus, Grafana и
# Alertmanager не имеют собственной защиты, пригодной для открытого интернета,
# а этот сервер уже получал попытку RCE через опубликованный наружу Redis без
# пароля (`LEGACY-071`). Доступ к интерфейсам — через SSH-туннель:
#   ssh -L 9090:127.0.0.1:9090 -L 3000:127.0.0.1:3000 deploy@ssh.bibliaris.com
#
# 🔴 LEGACY-224. Конфиги Prometheus и Alertmanager монтируются **каталогом**
# `./configs:/cfg:ro`, а не файлами по отдельности. Bind-mount отдельного файла
# привязан к inode: у отслеживаемых файлов новый inode создаёт `git reset --hard`
# на выкате (пишет во временный файл и переименовывает), у игнорируемых секретов —
# пересоздание руками или возврат из стеша (`LEGACY-223`). Контейнер после этого
# до конца жизни видит старое содержимое, а `POST /-/reload` перечитывает ту же
# устаревшую копию и отвечает `200`. Так 16.08.2026 на проде остались 13 правил
# из 19 при зелёном выкате, и так же три дня работал разошедшийся `metrics_token`.
#
# Точка монтирования `/cfg`, а не `/etc/prometheus`: флаги `--web.console.*`
# смотрят внутрь `/etc/prometheus`, монтирование поверх затёрло бы их. Тот же
# `/cfg` использует `scripts/ci.sh` при прогоне promtool, поэтому абсолютные пути
# внутри конфигов проверяются ровно те, что будут на сервере. Согласованность
# точек монтирования с путями внутри `configs/*.yml` стережёт
# `src/devops/monitoring-wiring.spec.ts` — единственная проверка этой связки,
# которая может покраснеть без сервера.
#
# ⚠️ Применённость конфигурации доказывают две разные вещи, и путать их нельзя:
#   docker exec books-prometheus stat -c %i /cfg/alert_rules.yml   # = inode на хосте: монтаж живой
#   curl -s 127.0.0.1:9090/api/v1/rules                           # что реально загрузил процесс
# Первое про монтирование, второе про `reload`. Совпадение inode само по себе
# не значит, что процесс перечитал файл: он мог этого и не делать.

services:
  prometheus:
    image: prom/prometheus:v2.45.1
    container_name: books-prometheus
    ports:
      - '127.0.0.1:${PROMETHEUS_PORT:-9090}:9090'
    volumes:
      # LEGACY-224, механизм — в шапке файла.
      #
      # ⚠️ Оба контейнера получают **весь** `configs/`, а значит и оба секрета
      # сразу: Prometheus видит `telegram_token`, Alertmanager — `metrics_token`
      # (bearer к `/api/metrics`), плюс оба видят `Caddyfile.prod` и
      # `ufw-rules.txt`. Права `400`/`65534` этому не мешают — процессы в обоих
      # контейнерах работают под тем самым uid 65534. Решением владельца принято
      # как есть: раскладывать секреты в каталог вне репозитория (он тоже
      # монтируется каталогом, то есть починку inode сохраняет) — отдельная
      # работа на сервере, заведена записью `LEGACY-226`.
      - ./configs:/cfg:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/cfg/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=14d'
      - '--storage.tsdb.retention.size=2GB'
      # Каталоги из образа, а не из монтирования — см. шапку файла.
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      # LEGACY-224: после перехода на каталог `POST 9090/-/reload` подхватывает
      # правки `prometheus.yml`, `alert_rules.yml` и `recording_rules.yml` без
      # пересоздания контейнера; до 16.08.2026 он отвечал `200`, не меняя ничего.
      # Конфиг Alertmanager это перечитывание не касается — у него свой
      # `POST 9093/-/reload`, а `configs/grafana/**` требует рестарта Grafana.
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - monitoring
      - books-network
    depends_on:
      - node-exporter

  grafana:
    image: grafana/grafana:10.1.5
    container_name: books-grafana
    ports:
      - '127.0.0.1:${GRAFANA_PORT:-3000}:3000'
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin123}
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
      - GF_SERVER_DOMAIN=${GRAFANA_DOMAIN:-localhost}
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:3000}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./configs/grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped
    networks:
      - monitoring
    depends_on:
      - prometheus

  node-exporter:
    image: prom/node-exporter:v1.6.1
    container_name: books-node-exporter
    ports:
      - '127.0.0.1:${NODE_EXPORTER_PORT:-9100}:9100'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      # LEGACY-219. Каталог textfile-коллектора: `backup_database.sh` кладёт сюда
      # отметку успешного прогона, node-exporter отдаёт её как обычную метрику.
      # Через неё правило видит и упавший бэкап, и не запустившийся cron —
      # метрика в обоих случаях просто перестаёт обновляться.
      - ${NODE_TEXTFILE_DIR:-/opt/books/monitoring/textfile}:/var/lib/node_exporter/textfile:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      - '--collector.textfile.directory=/var/lib/node_exporter/textfile'
    restart: unless-stopped
    networks:
      - monitoring

  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: books-alertmanager
    ports:
      - '127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093'
    volumes:
      # LEGACY-224: тот же каталог и та же причина, что у Prometheus (шапка файла).
      # Для токена это важно отдельно: `configs/telegram_token` читается при
      # каждой отправке, и при пофайловом монтаже заменённый на хосте токен
      # внутри контейнера оставался прежним до пересоздания.
      #
      # 🔴 Владелец файла с токеном — uid 65534 (`nobody`), права 400: под этим
      # пользователем работает процесс в контейнере, файл `deploy:600` он
      # прочитать не сможет. Права на хосте — единственное, что теперь решает:
      # `chown -R nobody:nobody /etc/alertmanager` из образа конфига больше
      # не касается, он лежит в `/cfg`.
      #
      # ⚠️ Неверный путь или нечитаемый токен ломают **только доставку**, и молча:
      # конфиг валиден, `amtool check-config` зелёный (он `bot_token_file`
      # не читает — об этом сказано у шага «Monitoring config check» в
      # `scripts/ci.sh`), контейнер здоров, а первый же алерт
      # умирает в `could not read` в `docker logs books-alertmanager`. Поэтому
      # приёмка после любой правки этой строки — дымовая отправка
      # (`amtool alert add`), а не взгляд на состояние контейнера. Наличие обоих
      # секретов проверяет `scripts/setup_monitoring.sh` перед запуском стека.
      - ./configs:/cfg:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/cfg/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://localhost:9093'
    restart: unless-stopped
    networks:
      - monitoring
    depends_on:
      - prometheus

volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  alertmanager_data:
    driver: local

networks:
  monitoring:
    driver: bridge
  # Сеть приложения: Prometheus скребёт его по внутреннему имени `app:5000`,
  # маршрут метрик наружу не публикуется.
  books-network:
    external: true
    name: ${APP_NETWORK:-src_default}
