name: 👁 Deploy Queue Watchdog

# 🔴 LEGACY-249. Очередь выката (`concurrency: production-deploy`, `LEGACY-245`) держит
# на группу один выполняющийся прогон и **один** ожидающий. Третий, встав в очередь,
# отменяет ожидавшего — `cancel-in-progress` управляет только отменой выполняющегося
# и на это не влияет. Сценарий не экзотический, а ровно тот, ради которого заводили
# очередь: теги ставят пачками, когда чинят неудачный релиз.
#
# 🔴 Отменённый в ожидании прогон не запускает **ни одного** job'а. Поэтому его не видит
# ничто внутри самого `deploy.yml`: `🚨 Notify Cancelled` живёт в job `notify`, а условие
# шага вычисляется только внутри запущенного job'а. Тег уходил из Telegram-журнала целиком —
# ни «Выкат начат», ни закрывающего сообщения, — и со стороны это неотличимо от «выкачен».
#
# Отсюда отдельный воркфлоу: `workflow_run` смотрит на прогоны **снаружи** и видит
# `conclusion: cancelled` там, где изнутри смотреть уже некому.
#
# ⚠️ Отмену руками этот сторож дублировать не должен — по ней `🚨 Notify Cancelled`
# отрабатывает сам. Отличаются они числом стартовавших job'ов: у снятого из очереди
# прогона их ноль. Именно это и проверяется, а не тип события.
#
# Файл обязан лежать в ветке по умолчанию: `workflow_run` берётся только оттуда.
# В группу `production-deploy` этот воркфлоу не входит намеренно — он ничего не катит
# и обязан отработать, пока очередь занята.
on:
  workflow_run:
    workflows: ['📦 Production Deployment']
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  report-dropped-run:
    name: 🚨 Notify Dropped From Queue
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    if: ${{ github.event.workflow_run.conclusion == 'cancelled' }}

    steps:
      # Ветка по умолчанию, а не выкатываемый ref: скрипт здесь утилита, а не часть релиза.
      # Тот же довод, что и у `📥 Checkout Notifier` в `deploy.yml`.
      - name: 📥 Checkout Notifier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            scripts/notify_telegram.sh
          sparse-checkout-cone-mode: false

      # 🔴 Признак — «отработал ли job `notify` наблюдаемого прогона», а не «сколько job'ов
      # у него в списке». Разница принципиальная. Считать стартовавшие job'ы значило бы
      # угадывать, заводит ли GitHub записи job'ов для прогона, который стоит в очереди и
      # ни разу не стартовал; проверить это без трёх тегов на проде нельзя, а сторож,
      # чьё нормальное состояние — молчание, в случае ошибки неотличим от исправного.
      #
      # `📢 Notifications` в `deploy.yml` объявлен с `if: always()`, то есть отрабатывает и
      # при отмене руками, и при отказе. Значит вопрос «сказали ли уже про этот прогон в
      # канал» отвечается прямо: если этот job дошёл до `conclusion`, сообщение было —
      # молчим. Если не дошёл, не было — говорим. Дублирования не возникает по построению,
      # а не по совпадению.
      #
      # ⚠️ `runs/<id>/jobs` по умолчанию отдаёт `filter=latest`, то есть job'ы последней
      # попытки. Это то, что нужно: повторный запуск прогона рассматривается сам по себе.
      - name: 🔍 Did the run report to the channel?
        id: jobs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          jobs_json=$(gh api "repos/${REPO}/actions/runs/${RUN_ID}/jobs" --paginate)
          total=$(printf '%s' "$jobs_json" | jq -s 'map(.jobs) | add | length')
          reported=$(printf '%s' "$jobs_json" | jq -s --arg name "📢 Notifications" \
            '[ (map(.jobs) | add)[] | select(.name == $name and .conclusion != null) ] | length')
          echo "jobs in run: ${total}, notify job finished: ${reported}"
          echo "reported=${reported}" >> "$GITHUB_OUTPUT"

      # Сообщение уходит только про прогон, о котором в канал ещё не сказали. Отмену руками
      # посреди выката объявляет `🚨 Notify Cancelled` внутри `deploy.yml`, и вторая копия
      # сообщения хуже её отсутствия: канал перестают читать, и в нём теряется отказ.
      #
      # Формулировка не утверждает причину. Снятие из очереди и отмена руками до назначения
      # раннера дают одно и то же наблюдаемое состояние, а ложная тревога гонит дежурного
      # искать несуществующий второй тег.
      - name: 🚨 Notify Silent Cancellation
        if: ${{ steps.jobs.outputs.reported == '0' }}
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          REF_NAME: ${{ github.event.workflow_run.head_branch }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          bash scripts/notify_telegram.sh \
            "Выкат отменён до старта · books · ${REF_NAME:-без ревизии}" \
            "Прогон отменён, не запустив ни одной job: снят из очереди более новым тегом либо отменён руками сразу после пуска." \
            "На прод ничего не уезжало, миграции не начинались." \
            "${RUN_URL}"
