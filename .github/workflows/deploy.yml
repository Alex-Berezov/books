name: 📦 Production Deployment

# 🔴 LEGACY-241. `branches: [main]` снят 17.08.2026 решением владельца. Выкат — это
# `prisma migrate deploy` плюс пересоздание контейнера (`scripts/deploy_production.sh`),
# то есть окно, в котором админка не отвечает. С триггером на push каждое слияние
# открывало это окно в произвольный момент, в том числе посреди публикации контента,
# и предупредить об этом было нечем. Теперь выкат — явное действие: тег `v*` или
# `workflow_dispatch`.
#
# ⚠️ Проверок от этого не убавилось, но само собой это не получилось. Всё, что делает
# job `test` ниже, на push в `main` выполняет `ci.yml`: `yarn ci` (lint, typecheck,
# `bash -n` по `scripts/*.sh`, drift-check, check:env, конфиги Prometheus и Alertmanager,
# `test:cov` с порогом) плюс отдельный job `e2e` с postgres и redis.
#
# 🔴 А вот job `build` counterpart'а не имела: `docker/build-push-action` жила только
# здесь, и со снятием триггера сборка образа ушла бы с пути слияния целиком — поломка
# `Dockerfile` впервые краснела бы на теге, когда окно выката уже объявлено в канал.
# Поэтому в `ci.yml` заведён отдельный job `image` (`Docker image (build only)`) —
# именно job, а не шаг в `scripts/ci.sh`: скрипт зовут и локально перед сдачей, а холодная
# сборка образа тянет полный `yarn install` из сети и не имеет кэша слоёв `type=gha`.
# Сверять надо было **обе** job'ы, а не только `test`; проверено пошагово 17.08.2026.
#
# Инварианты держит `src/devops/deploy-trigger.spec.ts`: и возврат `branches:` сюда,
# и пропажа сборки образа с пути слияния краснеют по отдельности.
on:
  push:
    tags:
      - 'v*' # Triggers on tags like v1.0.0, v2.1.3, etc.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (tag, branch, or commit)'
        required: true
        default: 'main'
      # 🔴 LEGACY-247. Вариант `staging` убран 18.08.2026. Он не переключал ничего:
      # ssh шёл на `vars.PRODUCTION_SERVER`, проверка живости и дым — на
      # `vars.PRODUCTION_DOMAIN`, миграции применялись к боевой базе, а после
      # `LEGACY-241` «стейджевый» запуск ещё и объявлял контент-менеджеру окно
      # недоступности прода. Менялись только имя окружения GitHub и строка в логе.
      # Вход `workflow_dispatch`, который не меняет поведения, опаснее отсутствующего:
      # он читается как предохранитель, и выбравший его при неуверенности катит прод.
      #
      # Стенда в проекте нет — из переменных репозитория объявлены только
      # `PRODUCTION_SERVER` и `PRODUCTION_DOMAIN`. Появится — вариант возвращается
      # вместе с парой `STAGING_SERVER` / `STAGING_DOMAIN` и выбором адресов по входу,
      # включая адрес дыма; вернуть его без этой пары не даёт спека
      # `src/devops/deploy-trigger.spec.ts`.
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
      skip_tests:
        description: 'Skip tests (emergency deploy)'
        required: false
        type: boolean
        default: false
      skip_backup_emergency:
        description: 'Skip pre-deploy backup (emergency only!)'
        required: false
        type: boolean
        default: false

# Global workflow permissions
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

# 🔴 LEGACY-245. Группа — константа, и это не небрежность. Привычное
# `${{ github.workflow }}-${{ github.ref }}` здесь само является дефектом: у двух
# тегов `github.ref` разный, прогоны попадают в разные группы и идут параллельно —
# два `prisma migrate deploy` против одной базы и два пересоздания контейнера на
# одном сервере. Теги ставят пачками, когда чинят неудачный релиз, так что это
# обычный ход событий, а не край. Спека требует, чтобы в `group` не было ни одного
# `${{ }}`, кроме постоянных на все прогоны `github.workflow` и `github.repository`:
# перечислять запрещённые контексты поимённо бесполезно, мимо списка проходят
# `github.run_number`, `github.run_attempt`, `inputs.*` и любой следующий.
#
# 🔴 `cancel-in-progress: false` обязателен. Выкат, отменённый посреди
# `prisma migrate deploy`, оставляет частично применённую пачку миграций
# (`LEGACY-242`) — это хуже очереди.
#
# ⚠️ У `ci.yml` с 18.08.2026 свой `concurrency` (`LEGACY-240`), и записи не путать:
# там группа включает `github.ref` **и** суффикс, уникальный на прогон для всего, кроме
# `pull_request`, — то есть push в `main` в очередь не встаёт вообще. Отмена включена
# ровно для `pull_request`; для push в `main` она не просто выключена значением
# `cancel-in-progress`, а исключена самой группой — см. абзац про глубину очереди ниже,
# он применим к обоим файлам.
#
# `workflow_dispatch` попадает в ту же группу намеренно: ручной выкат во время
# тегового обязан ждать, а не идти рядом.
#
# ⚠️ Очередь здесь глубиной один, и это ограничение GitHub, а не настройки.
# В группе держится один выполняющийся прогон и один ожидающий; третий, встав в
# очередь, **отменяет** ожидавшего — независимо от `cancel-in-progress`, который
# управляет только отменой выполняющегося. Три тега подряд: первый катится, второй
# снимается в ожидании, третий катится следом. Отменённый в ожидании прогон не
# запускает ни одного job'а, поэтому по нему не уходит ни «Выкат начат», ни
# `🚨 Notify Cancelled` — тег молча исчезает из журнала выкатов (`LEGACY-249`).
# Для базы это безопасно: миграции такого прогона не начинались.
#
# Инвариант держит `src/devops/deploy-trigger.spec.ts`.
concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: books-app
  DEPLOY_USER: deploy

jobs:
  # =====================================================
  # TESTING AND QUALITY CHECKS
  # =====================================================

  test:
    name: 🧪 Tests & Quality Checks
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    # LEGACY-222. Сравнение именно с `'true'`, а не `!github.event.inputs.skip_tests`:
    # булев вход `workflow_dispatch` приходит в `github.event.inputs` **строкой**, и
    # непустая `'false'` в выражениях GitHub истинна — с отрицанием job пропускалась
    # при любом ручном запуске, и со снятой галкой тоже. На теге `v*` вход пуст:
    # `'' != 'true'` истинно, job выполняется. (До 17.08.2026 сюда же попадал push
    # в `main` — триггер снят, `LEGACY-241`.)
    if: ${{ github.event.inputs.skip_tests != 'true' }}

    # ⚠️ С 03.09.2026 (`LEGACY-364`) оба шага, которые пользовались базой, уехали
    # в job `e2e`, и `DATABASE_URL` в этом job'е больше не задаётся нигде: юниты
    # в базу не ходят. Сервисы **оставлены намеренно** и снимаются отдельно —
    # снятие поднимает вопрос «а не ходит ли туда хоть один юнит», а ответ на него
    # проверяется только красным прогоном на теге, то есть ценой ещё одного
    # сгоревшего выката. Не читать этот блок как «`test:cov` работает с базой».
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: books_test
        # ⚠️ `max_connections` здесь не поднять: `services` в GitHub Actions не
        # принимает команду контейнера, а у `postgres:14` он по умолчанию 100.
        # Поэтому расход подключений ограничен со стороны клиента — `max` у пула
        # `pg` в `src/prisma/prisma.service.ts`, значение приходит из
        # `DATABASE_POOL_MAX`, а для e2e его выставляет
        # `test/setup-after-env-e2e.ts` (5 на воркер). Без потолка параллельный
        # прогон падает с «sorry, too many clients already», причём падает не
        # тест, а случайный запрос внутри него, и выглядит это как сломанный код.
        #
        # 🔴 До `LEGACY-237` здесь было написано `connection_limit=5` — параметр
        # движка Prisma, который драйверный адаптер не читает вовсе. Потолка
        # не существовало, а комментарий называл его настроенным.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # For semantic versioning

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: 🔧 Install Dependencies
        run: |
          yarn --frozen-lockfile
          yarn prisma generate

      - name: 📋 Lint & Type Check
        run: |
          yarn lint
          yarn typecheck

      # ⚠️ Продублировано из `scripts/ci.sh` по той же причине, что и шаги ниже: выкат
      # идёт по тегу `v*`, где `ci.yml` не запускается вовсе. `scripts/*.sh` не читает ни
      # eslint, ни tsc, ни jest, а `notify_telegram.sh` вызывается из job `deploy` до
      # отметки `📍 Mark server stage reached` — опечатка в нём валит релиз при исправном
      # приложении (LEGACY-241).
      - name: 🐚 Shell Script Syntax
        run: |
          for sh_file in scripts/*.sh; do
            echo "  $(basename "$sh_file")"
            bash -n "$sh_file"
          done

      # LEGACY-123. Тот же вызов несёт третий проход: идентификаторы сырого SQL из `src/`,
      # `prisma/` и `libs/` сверяются со `schema.prisma`. Отдельного шага у него нет —
      # см. `scripts/ci.sh`.
      - name: 🔀 Schema/Migration Drift + Raw SQL Identifiers
        run: |
          yarn drift-check:self-test
          yarn drift-check

      # 🔴 ADR-018, `LEGACY-242`. Релиз несёт всё, что слито с прошлого тега, а
      # `prisma migrate deploy` не оборачивает пачку в транзакцию: отказ на пятой миграции
      # из семи оставляет четыре применёнными. Пережить это можно ровно пока предыдущий
      # образ работает на новой схеме — то есть пока в миграции нет разрушающей конструкции.
      # Откат в этом проекте откатывает образ, а не схему, поэтому проверка и делает откат
      # осмысленным. Продублировано из `scripts/ci.sh`: выкат идёт по тегу `v*`, где
      # `ci.yml` не запускается вовсе (`LEGACY-207`, `LEGACY-209`).
      - name: 🧬 Migration Backwards-Compatibility Check
        run: |
          yarn check-migration-compat:self-test
          yarn check-migration-compat

      # ⚠️ Продублировано из `scripts/ci.sh` по той же причине, что и drift-check выше:
      # `ci.yml` триггерится только на push в `main` и на pull request, а выкат идёт отсюда
      # и по тегу `v*` тоже. Без этой строки релиз по тегу уезжал бы без сверки ключей
      # окружения с `.env.example` — то самое расхождение конвейеров, которое закрывал
      # LEGACY-078 на фронте (LEGACY-207, LEGACY-209).
      - name: 🔑 Environment Key Check
        run: |
          yarn check:env:self-test
          yarn check:env

      # ⚠️ Продублировано из `scripts/ci.sh` по той же причине, что и два шага выше:
      # выкат идёт по тегу `v*`, где `ci.yml` не запускается вовсе. Содержимое конфигов
      # мониторинга не разбирает больше ничто — ни tsc, ни eslint; битый
      # `alertmanager.yml` обнаруживался бы только тем, что контейнер на сервере
      # не поднялся (LEGACY-096). Версии образов совпадают с docker-compose.monitoring.yml.
      # (Раскладку монтирований и пути внутри контейнера сверяет спека
      # `src/devops/monitoring-wiring.spec.ts` — но не то, что написано в правилах.)
      - name: 📡 Monitoring Config Check
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/configs:/cfg:ro" \
            prom/prometheus:v2.45.1 check rules /cfg/alert_rules.yml /cfg/recording_rules.yml
          docker run --rm --entrypoint amtool -v "$PWD/configs:/cfg:ro" \
            prom/alertmanager:v0.26.0 check-config /cfg/alertmanager.yml
          # Поведение правил, а не только синтаксис: без этого шага правило с верными
          # скобками и несовпадающими метками молчит навсегда при зелёном конвейере.
          docker run --rm --entrypoint promtool -w /cfg -v "$PWD/configs:/cfg:ro" \
            prom/prometheus:v2.45.1 test rules /cfg/alert_rules.test.yml

      # LEGACY-224/225. Пара к шагу `Prometheus config check` в `scripts/ci.sh` — здесь
      # обязательно, потому что выкат идёт по тегу `v*`, где `ci.yml` не запускается.
      # `prometheus.yml` не разбирал ни один шаг до 16.08.2026: `check rules` читает только
      # файлы правил, `amtool check-config` — только конфиг Alertmanager. А абсолютные пути
      # внутрь контейнера (`credentials_file`) и относительные `rule_files` живут именно там.
      #
      # ⚠️ Каталог копируется с пустышкой вместо токена: в непроверочном режиме
      # `check config` требует существования файла из `credentials_file`, а
      # `configs/metrics_token` в git не едет (`.gitignore`). `--syntax-only` не годится —
      # он отключает как раз проверку существования файлов правил.
      - name: 📡 Prometheus Config Check
        run: |
          CFG_CHECK_DIR="$(mktemp -d)"
          SECRETS_CHECK_DIR="$(mktemp -d)"
          trap 'rm -rf "$CFG_CHECK_DIR" "$SECRETS_CHECK_DIR"' EXIT
          tar -cf - -C configs --exclude='*token*' . | tar -xf - -C "$CFG_CHECK_DIR"
          # Секреты монтируются отдельным каталогом (LEGACY-226), и `check config`
          # в непроверочном режиме требует существования файла из `credentials_file`.
          printf 'ci-dummy-token\n' > "$SECRETS_CHECK_DIR/metrics_token"
          # 🔴 `mktemp -d` даёт `0700`, а promtool в образе работает под `nobody`
          # (uid 65534): без прав на вход он не откроет ни конфиг, ни секрет.
          chmod -R a+rX "$CFG_CHECK_DIR" "$SECRETS_CHECK_DIR"
          docker run --rm --entrypoint promtool \
            -v "$CFG_CHECK_DIR:/cfg:ro" -v "$SECRETS_CHECK_DIR:/secrets:ro" \
            prom/prometheus:v2.45.1 check config /cfg/prometheus.yml

      - name: ♻️ Cache Jest transform
        uses: actions/cache@v4
        with:
          path: /tmp/jest_rs
          key: jest-${{ runner.os }}-${{ hashFiles('yarn.lock', 'tsconfig.json') }}-${{ github.sha }}
          restore-keys: |
            jest-${{ runner.os }}-${{ hashFiles('yarn.lock', 'tsconfig.json') }}-
            jest-${{ runner.os }}-

      # ⚠️ `test:cov`, а не `test`: порог покрытия живёт в `jest.coverageThreshold`
      # и проверяется только при `--coverage`. Если здесь оставить `yarn test`,
      # порог будет краснеть в CI и молчать при выкате — ровно то расхождение
      # конвейеров, которое закрывал LEGACY-078 на фронте. Цена — прогон дольше
      # обычного, и она принята сознательно.
      - name: 🧪 Unit Tests (with coverage thresholds)
        run: yarn test:cov
        env:
          NODE_ENV: test

  # =====================================================
  # E2E TESTS
  # =====================================================

  # 🔴 `LEGACY-364`. Отдельный job, а не два шага в конце `test`.
  #
  # До 03.09.2026 e2e шли тем же job'ом сразу после `yarn test:cov` по 2569
  # юнитам с покрытием. Раннер к моменту e2e был занят своим же прогоном, набор
  # `test/seed-dataset.e2e-spec.ts` шёл втрое дольше обычного (46-48 с против
  # 17.7 с) и не укладывался в бюджет хука `afterAll`, где стоит один
  # `await app.close()`. Ни один тест при этом не падал — падал набор целиком,
  # то есть выкат вставал на шуме. Так сгорели два тега подряд: `v1.0.27`
  # и `v1.0.28`.
  #
  # ⚠️ Тот же самый прогон той же самой командой в `ci.yml:178` — отдельным
  # job'ом на чистом раннере — на тех же коммитах зелёный. Разница была ровно
  # в соседстве с `test:cov`, и здесь она снимается тем же способом.
  #
  # ⚠️ Шаг `🔧 Setup Test Database` переехал сюда **без изменений** и остаётся
  # здесь насовсем. Он избыточен (`test/setup-e2e.ts` сам создаёт базы-шаблоны,
  # а `test/setup-after-env-e2e.ts` уводит каждый воркер в свою копию, так что
  # `books_test` не читает ни один из них), но оставлен сознательно: снятие
  # шага конвейера запрещено полностью, а цена ошибки в оценке «мёртвости» -
  # красный выкат на теге против десятков секунд прогона. Не снимать, не
  # глушить `if:`, не переносить: вопрос о снятии решён окончательно
  # (`decisions-log.md`, 03.09.2026). Сама запись `LEGACY-364` при этом
  # остаётся **живой** с исходом «принято» — она ведёт класс «конвейеры-близнецы
  # расходятся молча», и закрывать её по этому комментарию нельзя.
  # Присутствие шага стережёт кейс «job выката с e2e держит шаг подготовки
  # базы» в `src/devops/ci-e2e-wiring.spec.ts`.
  #
  # ⚠️ Сервисы подняты свои: без базы и Redis шаг красен всегда, и «починка»
  # свелась бы к его удалению. Health-check обязателен — без него шаги стартуют
  # раньше, чем postgres принимает подключения.
  e2e:
    name: 🧪 E2E Tests
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    # 🔴 `if:` у этого job'а нет намеренно (решение арбитра от 03.09.2026).
    # Условие — это ровно тот способ, которым job тихо становится зелёным
    # и пустым, а проверка при этом «есть». Пропуск e2e на ручном запуске
    # разрешает `if:` job'а `deploy` ниже, и там он виден рядом с остальными
    # разрешениями, а не спрятан здесь.

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: books_test
        # `max_connections` здесь не поднять (`services` не принимает команду
        # контейнера), поэтому расход подключений ограничен со стороны клиента —
        # `DATABASE_POOL_MAX` выставляет `test/setup-after-env-e2e.ts`, 5 на воркер
        # (`LEGACY-237`).
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: 🔧 Install Dependencies
        run: |
          yarn --frozen-lockfile
          yarn prisma generate

      # Ключ отличается от кэша job'а `test`: тот греется юнитами, этот —
      # наборами e2e, и общий ключ давал бы гонку двух параллельных job'ов
      # за одну запись.
      - name: ♻️ Cache Jest transform
        uses: actions/cache@v4
        with:
          path: /tmp/jest_rs
          key: jest-e2e-deploy-${{ runner.os }}-${{ hashFiles('yarn.lock', 'tsconfig.json') }}-${{ github.sha }}
          restore-keys: |
            jest-e2e-deploy-${{ runner.os }}-${{ hashFiles('yarn.lock', 'tsconfig.json') }}-
            jest-e2e-deploy-${{ runner.os }}-

      - name: 🔧 Setup Test Database
        run: |
          yarn prisma migrate deploy
          yarn prisma db seed
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/books_test?schema=public

      # `--no-cache` убран (был добавлен 23.07.2026 вместе с подъёмом лимита
      # памяти — причина в коммите не записана, а транспиляция всех наборов заново
      # стоит минуты). Кэш ts-jest живёт между прогонами через actions/cache выше;
      # лимит памяти остаётся, так что прежняя защита от OOM не тронута.
      # 🔴 `test:e2e:serial` содержит `--runInBand`, который **переопределяет**
      # `maxWorkers` из конфига: с ним параллельность из `jest-e2e.json` не
      # включилась бы вовсе, и правка выглядела бы сделанной, ничего не ускорив.
      # Отдельный скрипт `test:e2e:parallel` без этого флага; `:serial` оставлен
      # для отладки, где важен предсказуемый порядок.
      - name: 🧪 E2E Tests
        # ⚠️ Число воркеров задано явно, а не через `50%` из конфига: у раннера
        # мало ядер, и доля легко даёт одного воркера — параллельность
        # «включена», а прогон идёт как прежде. `E2E_WORKERS` читает globalSetup,
        # чтобы создать ровно столько баз, сколько будет воркеров.
        run: yarn test:e2e:parallel --maxWorkers=2
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/books_test?schema=public
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          E2E_WORKERS: 2
          # ⚠️ `NODE_OPTIONS` здесь не задаётся (`LEGACY-237`): скрипт
          # `test:e2e:parallel` выставляет свой прямо в команде, и он
          # побеждает переменную job'а. Стоявшие тут 6144 не действовали
          # никогда — действовали 8192 из `package.json`. Стерегут это
          # спеки `src/devops/ci-e2e-wiring.spec.ts`.

  # =====================================================
  # DOCKER IMAGE BUILD
  # =====================================================

  # ⚠️ Сборка образа идёт ПАРАЛЛЕЛЬНО тестам, а не после них (10.08.2026).
  # Раньше `needs: [test]` держал её за 11 минутами проверок, хотя образ от их
  # исхода не зависит: выкат всё равно ждёт обоих (`deploy: needs [test, build]`),
  # и при красных тестах собранный образ просто не выкатывается. Экономия — вся
  # длительность сборки, около трёх минут из критического пути.
  build:
    name: 🏗️ Build Docker Image
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⬇️ Normalize repository to lowercase
        # Some actions/registries require lowercase image names. Persist as REPO_LOWER for later steps.
        run: |
          echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: 🔍 Extract Version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="main-$(git rev-parse --short HEAD)"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: 🔑 Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 🔴 LEGACY-244. У `latest` было условие `enable={{is_default_branch}}`. Оно писалось,
      # когда воркфлоу срабатывал на push в `main`; после `LEGACY-241` он туда не ходит,
      # а на push тега ветка по умолчанию ложна — то есть на **автоматическом** пути
      # `latest` перестал двигаться вовсе и застыл на сборке от 17.08.2026. Оставался
      # ровно один путь, где он двигался: ручной запуск с `main`, где `is_default_branch`
      # истинно, — то есть тег обновлялся только тогда, когда кто-то вручную катал ветку,
      # и указывал на непомеченную ревизию. Застывший плавающий тег хуже отсутствующего:
      # он молчит, и потянувший его для отладки или восстановления получает не тот образ.
      #
      # `latest` здесь означает **последний релиз**, и условие сужено втрое:
      # 1. `github.event_name == 'push'` — ручной запуск исключён целиком. Без этого
      #    условие ловило бы `workflow_dispatch`, запущенный **с тега** (в списке
      #    «Use workflow from» теги выбираются наравне с ветками, а `📥 Checkout Code`
      #    идёт без `ref:` и берёт именно его): дежурный, вручную перекатывающий старый
      #    тег ради отката, молча переставлял бы `latest` назад.
      # 2. `github.ref_type == 'tag'` — собственно релизный путь.
      # 3. `!contains(github.ref_name, '-')` — пред-релизы. `v1.2.0-rc1` по семверу
      #    содержит дефис; без этой части первый же кандидат стал бы `latest`.
      #
      # ⚠️ Комментарий стоит здесь, а не внутри `tags: |`: это блочный скаляр, и строки
      # внутри него — не комментарии YAML, а значение, которое уедет в action.
      #
      # 🔴 Тег по SHA. `prefix={{branch}}-` на выкате с тега подставлял пустую строку, и
      # сборка падала на `invalid tag "ghcr.io/…/books:-9b9b4bc"` — то есть путь «тег v*»,
      # ради которого 17.08.2026 сняли триггер по ветке, не работал вовсе и обнаружился
      # только на первом настоящем теге (v1.0.0, 20.08.2026). Боевой сервер при этом не
      # пострадал: job `deploy` ждёт `build`, поэтому окно выката не открывалось.
      # Теперь префикс с веткой ставится только там, где ветка есть, а на теге образ
      # получает `sha-<короткий sha>`. Инвариант держит `deploy-trigger.spec.ts`.
      - name: 🏷️ Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix={{branch}}-,enable=${{ github.ref_type == 'branch' }}
            type=sha,enable=${{ github.ref_type != 'branch' }}
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref_type == 'tag' && !contains(github.ref_name, '-') }}

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build and Push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_DATE=${{ github.run_id }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 📋 Generate SBOM
        uses: anchore/sbom-action@v0
        continue-on-error: true # Don't block deployment on SBOM errors
        with:
          image: ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}:${{ steps.version.outputs.version }}
          artifact-name: sbom-${{ steps.version.outputs.version }}.spdx.json
          output-file: ./sbom-${{ steps.version.outputs.version }}.spdx.json

      - name: 🔍 Security Scan
        id: scan
        uses: anchore/scan-action@v3
        continue-on-error: true # Don't block deployment on scan errors
        with:
          image: ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}:${{ steps.version.outputs.version }}
          fail-build: false # Don't stop deployment on medium vulnerabilities

      # 🔴 Тот же шаг, что и на пути слияния, и по той же причине: без выгруженного отчёта
      # отказ сканера неотличим от чистого образа, а `continue-on-error` выше делает такой
      # отказ ещё и незаметным. Здесь это важнее, чем на слиянии: тег — это и есть релиз,
      # решение о котором уже принято. Шаг, заведённый только на одном пути, на втором
      # отсутствует молча (`LEGACY-207`, `LEGACY-209`), поэтому оба держит спека.
      #
      # Условие и `continue-on-error` — как в `ci.yml`: пустой выход `sarif` уронил бы
      # `actions/upload-artifact` на обязательном входе `path` и покрасил бы выкат отказом
      # сканера, а до сервера этот job идёт раньше выката.
      - name: 📤 Upload Scan Report
        if: always() && steps.scan.outputs.sarif != ''
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: vuln-scan-${{ steps.version.outputs.version }}
          path: ${{ steps.scan.outputs.sarif }}
          if-no-files-found: warn

  # =====================================================
  # PRODUCTION DEPLOYMENT
  # =====================================================

  # 🔒 Выкат по тегу не запускает `ci.yml` вовсе: тот висит на push в `main` и на pull
  # request. Собственная job `test` ниже гоняет тот же `yarn ci`, но она — про код в
  # момент выката, а не про то, что этот коммит когда-либо проходил конвейер целиком
  # (`ci.yml` держит ещё e2e с postgres и redis и отдельную сборку образа).
  #
  # Гейт ждёт, пока прогон `ci.yml` по этому же SHA завершится, и требует `success`.
  # Тег, поставленный на коммит, который в `main` не проходил, до сервера не доходит.
  # На `workflow_dispatch` гейт пропускается: там ветку выбирает человек, а `ci.yml`
  # по ней прогонялся на слиянии.
  ci_gate:
    name: 🔒 CI Green For This Commit
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: 🔎 Wait for a successful ci.yml run on ${{ github.sha }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Пуш тега часто идёт следом за пушем коммита, поэтому прогон может ещё не
          # завершиться — ждём. Отсутствие прогона вовсе тоже ожидание: он заводится
          # не мгновенно.
          deadline=$(( $(date +%s) + 25 * 60 ))
          while :; do
            runs=$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&per_page=100" \
              --jq '[.workflow_runs[] | select(.path == ".github/workflows/ci.yml")]')
            total=$(echo "$runs" | jq 'length')
            done_ok=$(echo "$runs" | jq '[.[] | select(.conclusion == "success")] | length')
            pending=$(echo "$runs" | jq '[.[] | select(.status != "completed")] | length')

            if [ "$done_ok" -gt 0 ]; then
              echo "✅ ci.yml прошёл на $SHA."
              exit 0
            fi

            if [ "$total" -gt 0 ] && [ "$pending" -eq 0 ]; then
              echo "::error::Прогон ci.yml на коммите $SHA завершился неуспешно. Выкат отменён."
              echo "$runs" | jq -r '.[] | "  \(.name): \(.status) \(.conclusion) \(.html_url)"'
              exit 1
            fi

            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::За 25 минут у коммита $SHA так и не появилось успешного прогона ci.yml (найдено прогонов: $total). Выкат отменён."
              exit 1
            fi

            echo "⏳ Жду ci.yml на $SHA (прогонов: $total, из них незавершённых: $pending)..."
            sleep 30
          done

  deploy:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    # Ждёт четверых: тесты больше не блокируют сборку, но по-прежнему блокируют
    # выкат, а `ci_gate` держит требование зелёного `ci.yml` на самом коммите тега.
    # 🔴 `e2e` в списке с 03.09.2026 (`LEGACY-364`): набор переехал из job'а `test`
    # отдельным job'ом, и без него здесь выкат уходил бы на прод, не дождавшись e2e
    # вовсе — то есть починка красноты обернулась бы снятием проверки с пути выката.
    needs: [test, e2e, build, ci_gate]
    # LEGACY-222. `skip_tests == 'true'`, а не сам вход: строка `'false'` истинна, и выкат
    # считал пропуск проверок разрешённым на каждом ручном запуске. Теперь пропуск проходит
    # только по осознанно поставленной галке, а на push и теге требуется `test == 'success'`.
    # `ci_gate` на ручном запуске пропускается, и `skipped` здесь — разрешение, а не отказ;
    # `failure` и `cancelled` останавливают выкат. Перечислены допустимые значения, а не
    # исключены недопустимые: новое состояние job'ы должно ошибаться в безопасную сторону.
    #
    # 🔴 `needs.e2e.result` перечислен **явно**, и это не дублирование `needs`.
    # `!cancelled()` снимает неявный гейт «все зависимости зелены»: с ним job
    # запускается и при упавшей зависимости. То есть без этой скобки перенос
    # e2e отдельным job'ом (`LEGACY-364`) снял бы набор с пути выката целиком —
    # красные e2e перестали бы останавливать прод, а выглядело бы это как
    # починка красноты.
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.test.result == 'success' || github.event.inputs.skip_tests == 'true') && (needs.e2e.result == 'success' || github.event.inputs.skip_tests == 'true') && (needs.ci_gate.result == 'success' || needs.ci_gate.result == 'skipped') }}
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
      url: https://${{ vars.PRODUCTION_DOMAIN }}
    outputs:
      # Читает job `rollback`: откат допустим только если выкат дошёл до сервера.
      server_stage_reached: ${{ steps.server_stage.outputs.reached }}

    steps:
      - name: 📥 Checkout Deployment Scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/deploy_production.sh
            scripts/notify_telegram.sh
            docker-compose.prod.yml
            .env.prod.template
          sparse-checkout-cone-mode: false

      - name: 🔑 Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: 📋 Prepare Deployment
        run: |
          echo "🔧 Deployment configuration:"
          echo "Version: ${{ needs.build.outputs.version }}"
          echo "Image: ${{ needs.build.outputs.image-tag }}"
          echo "Server: ${{ vars.PRODUCTION_SERVER }}"
          echo "Domain: ${{ vars.PRODUCTION_DOMAIN }}"

      # LEGACY-241. Окно обслуживания объявляется до того, как оно откроется.
      # Дальше идут `prisma migrate deploy` и пересоздание контейнера — минуты, в
      # которые админка не отвечает, и человек за ней должен знать, что это выкат,
      # а не поломка, и что сохранять сейчас нечего.
      #
      # ⚠️ Шаг стоит здесь, а не отдельным job'ом перед `test`: до этой точки уже
      # пройдены тесты и сборка, то есть выкат действительно начинается. Объявление
      # раньше врало бы каждый раз, когда конвейер краснеет на проверках.
      #
      # ⚠️ Это не отмена решения владельца от 16.08.2026 не слать в канал успехи.
      # То решение снимало ленту: при триггере на push сообщение уходило бы на каждое
      # слияние. Выкат теперь идёт только по тегу `v*` и ручному запуску, и сообщение
      # говорит не «всё хорошо», а «сервис сейчас недоступен» — это разные поводы.
      # Закрывают окно три пути, и вместе они покрывают все исходы прогона:
      # `📢 Deploy Window Closed` в конце этого же job'а (успех), `🚨 Notify Failure`
      # (отказ) и `🚨 Notify Cancelled` (отмена) в job `notify`. Объявленное и никогда
      # не закрываемое окно приучает не читать канал ровно так же, как лента успехов.
      #
      # 🔴 Версия и ссылка идут через `env`, а не подставляются в тело `run:`.
      # `needs.build.outputs.version` — это либо имя тега, либо свободный ввод
      # `workflow_dispatch`; подстановка `${{ }}` происходит до shell, поэтому версия
      # вида `x" "$(...)` исполнилась бы на раннере в шаге, где в окружении лежат
      # `TELEGRAM_BOT_TOKEN` и `TELEGRAM_CHAT_ID`. Соседний `🚨 Notify Failure` делает
      # так же и по той же причине.
      #
      # ⚠️ Проверки `-f` на существование скрипта здесь **нет**, и это решение, а не
      # пропуск. Первая редакция её ставила, оправдывая повторным запуском прогона по
      # старому тегу, — обоснование не выдержало проверки: `gh run rerun` берёт воркфлоу
      # из того же коммита, где нет ни этого шага, ни строки `scripts/notify_telegram.sh`
      # в разреженном чекауте. Единственный настоящий способ потерять файл — правка списка
      # `sparse-checkout`, и она уже краснеет спекой. Гард в этом положении только глушил
      # бы отключение оповещения правкой одной чужой строки.
      - name: 📢 Deploy Window Opened
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          VERSION: ${{ needs.build.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          bash scripts/notify_telegram.sh \
            "Выкат начат · books · ${VERSION:-без версии}" \
            "Админка и API недоступны несколько минут." \
            "${RUN_URL}"

      # 🔴 LEGACY-227. Отметка «до сервера дошли». Без неё условие отката
      # (`needs.deploy.result == 'failure'`) срабатывает и на отказе шагов,
      # которые идут до ssh: `Checkout Deployment Scripts` и `Setup SSH Agent`.
      # Сбой GitHub на checkout переливал бы прод предыдущим образом, при том
      # что на сервер никто не заходил. Шаг стоит вплотную перед выкатом:
      # всё, что падает раньше, откат не вооружает.
      - name: 📍 Mark server stage reached
        id: server_stage
        run: echo "reached=true" >> "$GITHUB_OUTPUT"

      # 🔴 LEGACY-241. Рабочее дерево на сервере переводится ровно на ту ревизию, из
      # которой собран образ (`github.sha`), а не на вершину `main`. Пока выкат шёл на
      # push в `main`, `origin/main` и коммит образа совпадали по построению, и прежний
      # `git fetch origin main` + `git reset --hard origin/main` был безобиден. С
      # переводом на тег они расходятся всегда: job `build` делает `actions/checkout@v4`
      # без `ref`, то есть собирает `github.sha`, а сервер тянул бы `docker-compose.prod.yml`,
      # `configs/**` и сам `deploy_production.sh` с вершины `main` — из кода, которого в
      # релизе нет. Обратный случай не менее живой: выкат старого тега ради отката не
      # вернул бы старый compose, и откат «вперёд» молча не откатывал бы ничего, кроме образа.
      #
      # 🔴 Совпадение `HEAD` с `github.sha` сверяется явно, а не берётся из кода возврата
      # `checkout`: промах ревизии обязан краснеть здесь, до `prisma migrate deploy`, а не
      # проявиться контейнером, который не поднялся. Инвариант держит
      # `src/devops/deploy-trigger.spec.ts`.
      #
      # 🔴 LEGACY-246. Делимитер heredoc **в кавычках** — `<< 'EOF'`, и это не косметика.
      # Без кавычек тело разворачивается shell'ом раннера ещё до отправки, и сервером
      # считается только то, что вручную экранировано через `\$`. Так и потерялся
      # `$BACKUP_FLAG`: переменная задаётся здесь же, внутри heredoc, то есть на сервере,
      # а раскрывалась на раннере, где её нет; `run:` идёт через `bash -e` **без** `-u`,
      # поэтому подстановка молча давала пустую строку и галка `skip_backup_emergency`
      # не делала ничего.
      #
      # С кавычками правило простое и не требует помнить про каждый `$`: **весь текст
      # уезжает на сервер как есть**. Экранирование `\$` больше не нужно и было бы
      # ошибкой — на сервер приехал бы литерал `\$`.
      #
      # ⚠️ `${{ }}` кавычки не отменяют: эти подстановки делает GitHub Actions над текстом
      # воркфлоу до всякого shell. Поэтому `${{ secrets.ENV_PROD }}` по-прежнему попадает
      # в тело — но теперь **значение секрета** больше не проходит через shell раннера.
      # До кавычек секрет вида `JWT_SECRET=a$bc` уезжал на прод обрезанным до `a`, а
      # `$(...)` или обратный апостроф в секрете исполнились бы прямо на раннере.
      #
      # 🔴 Обратная сторона: переменную раннера внутрь такого heredoc уже не передать.
      # Поэтому `REPO_LOWER` считается на сервере из `${{ github.repository }}`, а не
      # шагом выше. Ссылка на переменную, заданную в `run:` до `ssh`, здесь молча
      # приехала бы на сервер пустой — это краснеет спекой.
      #
      # Инвариант держит `src/devops/deploy-trigger.spec.ts`: и потеря кавычек вокруг
      # делимитера, и ссылка на раннерную переменную внутри закавыченного тела.
      - name: 🚀 Deploy to Server
        run: |
          # Connect to server and execute deployment
          ssh -o StrictHostKeyChecking=no ${{ env.DEPLOY_USER }}@${{ vars.PRODUCTION_SERVER }} << 'EOF'
            set -euo pipefail

            echo "🔄 Preparing deployment environment..."
            cd /opt/books/app/src

            # Lowercase repository name for Docker. Считается на сервере: значение
            # приходит подстановкой Actions, а `tr` выполняется уже внутри heredoc.
            REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')

            # Save local changes and update code
            if [[ -d ".git" ]]; then
              # 🔴 Ревизия, работающая ПРЯМО СЕЙЧАС, снимается до чекаута и уезжает в
              # `save_current_state` переменной `DEPLOY_PREVIOUS_SHA`. Без неё скрипт брал
              # `git rev-parse HEAD` уже после `checkout --detach --force`, то есть писал в
              # `.rollback_info` выкатываемую ревизию, и откат откатывался на неё же.
              # Найдено ревью 18.08.2026 при закрытии `LEGACY-243`.
              DEPLOY_PREVIOUS_SHA=$(git rev-parse HEAD 2>/dev/null || echo "")
              export DEPLOY_PREVIOUS_SHA
              echo "↩️  Previous revision: ${DEPLOY_PREVIOUS_SHA:-unknown}"

              echo "📦 Stashing local changes..."
              git stash --include-untracked || true

              echo "🔄 Fetching deployed revision..."
              git fetch origin --prune --tags --force '+refs/heads/*:refs/remotes/origin/*'

              echo "🔄 Checking out ${{ github.sha }}..."
              git checkout --detach --force ${{ github.sha }}

              HEAD_SHA=$(git rev-parse HEAD)
              if [[ "$HEAD_SHA" != "${{ github.sha }}" ]]; then
                echo "Working tree is at $HEAD_SHA, expected ${{ github.sha }}"
                exit 1
              fi

              echo "✅ Code updated successfully"
              chmod +x scripts/deploy_production.sh
            else
              echo "/opt/books/app/src is not a git working tree — cannot pin the release revision"
              exit 1
            fi

            # Create .env.prod from secrets
            echo "📝 Creating .env.prod from secrets..."
            cat > .env.prod << 'ENVEOF'
          ${{ secrets.ENV_PROD }}
          ENVEOF
            chmod 600 .env.prod
            echo "✅ .env.prod created successfully"

            # Login to registry to pull image
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

            BACKUP_FLAG=""
            if [[ "${{ github.event.inputs.skip_backup_emergency }}" == "true" ]]; then
              echo "⚠️  EMERGENCY: Skipping pre-deploy backup!"
              BACKUP_FLAG="--no-backup"
            fi

            echo "🚀 Starting deployment..."
            ./scripts/deploy_production.sh \
              --image-tag "${{ needs.build.outputs.version }}" \
              --registry "${{ env.REGISTRY }}/$REPO_LOWER" \
              --skip-git-update \
              --pull \
              $BACKUP_FLAG \
              --force

            echo "✅ Deployment completed!"
          EOF

      - name: 🏥 Health Check
        run: |
          echo "🏥 Running post-deployment health checks..."

          # The container healthcheck probes /api/metrics and the deploy script waits on it, so
          # "healthy" means the process listens — not that it ever talked to Postgres. Liveness
          # says the same and nothing more. The wait must therefore end on *readiness reporting
          # `status: up`*, otherwise verification races the app's first database query
          # (01.08.2026: readiness hung ~20 s and failed 14 s after container start).
          max_attempts=20
          attempt=0

          until
            curl -sf --max-time 20 "https://${{ vars.PRODUCTION_DOMAIN }}/api/health/liveness" > /dev/null &&
            [[ "$(curl -sf --max-time 20 "https://${{ vars.PRODUCTION_DOMAIN }}/api/health/readiness" | jq -r '.status // "down"')" == "up" ]]
          do
            # `$(( ))` in an assignment, not `((attempt++))` as a statement: the latter returns the
            # *old* value, so on the first iteration it exits 1 and `bash -e` kills the step before
            # a single retry happens. Same bug as the one fixed in scripts/deploy_production.sh.
            attempt=$((attempt + 1))
            if [[ $attempt -ge $max_attempts ]]; then
              echo "❌ Health check failed after $max_attempts attempts"
              curl -s --max-time 20 "https://${{ vars.PRODUCTION_DOMAIN }}/api/health/readiness" || true
              exit 1
            fi
            echo "⏳ Attempt $attempt/$max_attempts..."
            sleep 15
          done

          echo "✅ Service is healthy!"

      - name: 📊 Verify Deployment
        run: |
          echo "📊 Verifying deployment..."

          # Which image actually answers. `unknown` means the running container predates the
          # APP_VERSION plumbing — reported, but not treated as a failed deployment.
          #
          # 🔴 Ретраи, а не одна попытка. 30.08.2026 выкат `v1.0.15` покраснел здесь на
          # исправном проде: `curl -sf` упёрся в свой `--max-time 20` через секунду после
          # того, как соседний шаг выше получил и `liveness`, и `readiness` со `status: up`,
          # — контейнеру было тридцать секунд. Тот шаг (`🏥 Health Check`) держит двадцать
          # попыток, цикл по маршрутам ниже — пять, и оба объясняют почему; проверке версии
          # тот же вывод не применили.
          #
          # 🔴 И главное: пустой ответ — это НЕ «версия не совпала». `jq -r '.version //
          # "unknown"'` подставляет `unknown` вместо `null` в разобранном JSON, но на пустом
          # вводе не выводит ничего вовсе, и `api_version` получался пустой строкой. Она
          # не равна ни `unknown`, ни ожидаемой версии — и уходила в ветку «старый контейнер
          # всё ещё отвечает», то есть «не смог спросить» подменялось вердиктом о состоянии
          # прода (урок `L-015`). Дальше по красноте дёргался job отката, который снёс бы
          # только что выкаченный исправный образ.
          #
          # ⚠️ Ослабления здесь нет и быть не должно: недостижимая после всех попыток версия
          # остаётся красной, просто со своим текстом. Пустой ответ в `unknown` не переводится
          # и в «пропускаем» не уходит — иначе выкат перестанет отличать «не ответили»
          # от «выкатилось не то».
          # ⚠️ Присваивание стоит в условии `if !`, а не глушится хвостом-заглушкой:
          # `set -e` не срабатывает на команде внутри условия, и неудачная попытка
          # честно уходит в пустую строку, которую ниже ловит своя красная ветка.
          # Хвост, отбрасывающий код возврата, здесь был бы именно глушением: оборванный
          # посреди JSON ответ (`jq` выходит с 5) выглядел бы так же, как успешный.
          api_version=""
          for attempt in 1 2 3 4 5; do
            if ! api_version=$(curl -sf --max-time 20 "https://${{ vars.PRODUCTION_DOMAIN }}/api/health/liveness" | jq -r '.version // "unknown"'); then
              api_version=""
            fi
            [[ -n "$api_version" ]] && break
            echo "⏳ Version probe - attempt $attempt/5: no answer from /api/health/liveness, retrying..."
            sleep 10
          done

          echo "🔍 API Version: $api_version"
          echo "🎯 Expected Version: ${{ needs.build.outputs.version }}"

          if [[ -z "$api_version" ]]; then
            echo "❌ Could not read the running version: /api/health/liveness did not answer in 5 attempts."
            echo "❌ This says nothing about which image is serving: the version was never read."
            exit 1
          elif [[ "$api_version" == "unknown" ]]; then
            echo "⚠️  Running container does not report its version — skipping the version check."
          elif [[ "$api_version" != "${{ needs.build.outputs.version }}" ]]; then
            echo "❌ Deployed version does not match the built one — the old container is still serving."
            exit 1
          fi

          # Check main endpoints. Retried: a single attempt right after a container swap tests the
          # timing of the deployment, not the health of the application.
          # `/api/metrics` used to be checked here. It is blocked at Caddy (403)
          # since 07.08.2026, so this loop would fail every deploy from now on.
          # On a workflow_dispatch run that failure now really does trigger the
          # rollback job below: since LEGACY-227 it depends on this job's result,
          # so a red step here undoes a perfectly good deployment. The endpoint is
          # not a health signal anyway: readiness is. See LEGACY-072.
          #
          # 🔴 Дым по админским маршрутам, а не только по readiness. Единственный
          # `/api/health/readiness` зелен и тогда, когда таблица маршрутов съедена:
          # `@Controller(':lang')` перехватывает литеральные админские пути той же
          # длины, зарегистрированные позже, и ручка отдаёт **404 вместо 401** при
          # полностью исправном приложении и базе. Так `GET /admin/authors` и
          # `/admin/authors/check-slug` были мертвы неделями (`LEGACY-201`: на проде
          # 14.08.2026 оба — 404, при том что соседний `/api/admin/pages/check-slug` —
          # 401; после починки 16.08.2026 и на них 401 — проверено запросом без токена
          # 17.08.2026, то есть ожидания ниже сняты с живого домена, а не с исходников).
          # Статические сторожа этого класса
          # уже есть (`src/common/testing/module-order.spec.ts` и `route-order.spec.ts`),
          # но они читают исходники; здесь проверяется то, чего им не видно вовсе:
          # что на живом домене за реверс-прокси эти пути действительно доезжают до
          # гварда именно в том образе, который только что выкатили.
          #
          # 🔴 Ожидаемый код задаётся у каждого пути явно, а «лишь бы ответило» не
          # годится ни в одну сторону: 404 и 5xx на закрытой ручке обязаны краснеть,
          # а 401 на ней — это **успех**, доказательство того, что маршрут дошёл до
          # гварда, то есть контроллер зарегистрирован и не перекрыт. Токен здесь не
          # нужен и не должен появиться: пускает ли гвард админа — вопрос e2e
          # (`test/admin-authors.e2e-spec.ts`), а не выката, и секрет на раннере ради
          # этого не заводится.
          #
          # Формат строки — «путь ожидаемый_код», разделитель ровно один пробел.
          # Список и способ сравнения держит спека `src/devops/deploy-smoke.spec.ts`.
          endpoints=(
            "/api/health/readiness 200"
            "/api/admin/rights/intakes 401"
            "/api/admin/authors 401"
            "/api/admin/authors/check-slug?slug=deploy-smoke 401"
            "/api/books 401"
          )

          for entry in "${endpoints[@]}"; do
            endpoint="${entry%% *}"
            expected="${entry##* }"
            code=""
            ok=false
            for attempt in 1 2 3 4 5; do
              # 🔴 Код сравнивается строкой из `-w '%{http_code}'`, а не берётся из
              # `curl -sf`: `-f` возвращает ненулевой код на 401, и правильный ответ
              # закрытой ручки выглядел бы как отказ выката. По той же причине `-f`
              # не должен появиться здесь и «для краткости» на публичных путях.
              #
              # `set +e` на время вызова: при `set -e` (шаг идёт через `bash -e`)
              # сетевой отказ оборвал бы цикл до печати кода и до ретраев. Дописывать
              # `|| echo "000"` нельзя — curl при отказе соединения сам печатает `000`
              # и возвращает ненулевой код, в переменную попало бы `000000`.
              set +e
              code=$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' \
                "https://${{ vars.PRODUCTION_DOMAIN }}$endpoint")
              set -e

              if [[ "$code" == "$expected" ]]; then
                ok=true
                break
              fi
              # ⚠️ Ретраи покрывают таймаут, сброс соединения и не доехавший образ,
              # но **не 429**: пять попыток по 10 с укладываются в 40 с, а окно
              # глобального лимитера — 60 с (`RATE_LIMIT_GLOBAL_WINDOW_MS`, 100
              # точек на `global:<ip>`). `/api/health/*` лимитер пропускает, четыре
              # админских пути — нет. Пять «HTTP 429, expected 401» подряд в логе
              # означают исчерпанную корзину адреса раннера, а не сломанный
              # маршрут; лечится задержкой длиннее окна или чтением `Retry-After`.
              echo "⏳ $endpoint - attempt $attempt/5: HTTP $code, expected $expected, retrying..."
              sleep 10
            done

            if [[ "$ok" == true ]]; then
              echo "✅ $endpoint - HTTP $code"
            else
              echo "❌ $endpoint - expected HTTP $expected, got HTTP $code"
              exit 1
            fi
          done

          echo "✅ All verifications passed!"

      # LEGACY-241. Закрытие окна обслуживания на успешном пути.
      #
      # ⚠️ `if: ${{ success() }}` ничего не добавляет к поведению — это условие шага по
      # умолчанию, и после красного `📊 Verify Deployment` шаг был бы пропущен и без него.
      # Записано явно затем, чтобы правка на `always()` или `!cancelled()` была видна в
      # диффе и краснела спекой: «завершён» после отказа — худший вариант молчания, чем
      # отсутствие сообщения вовсе. Условие закреплено `src/devops/deploy-trigger.spec.ts`
      # именно как `success()`, а не «любое непустое».
      #
      # Шаг последний в job'е намеренно — после проверки здоровья и дыма по маршрутам:
      # «завершён» означает «прод отвечает тем образом, который выкатили», а не
      # «ssh отработал». Что он последний, спека проверяет отдельно: шаг, дописанный
      # после объявления, снова растянул бы окно за границу сообщения.
      - name: 📢 Deploy Window Closed
        if: ${{ success() }}
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          VERSION: ${{ needs.build.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          bash scripts/notify_telegram.sh \
            "Выкат завершён · books · ${VERSION:-без версии}" \
            "Админка и API снова доступны." \
            "${RUN_URL}"

  # =====================================================
  # NOTIFICATIONS
  # =====================================================

  notify:
    name: 📢 Notifications
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    # `test` и `e2e` в списке намеренно: `deploy` зависит от обоих, и при красных
    # тестах получает `skipped`. Без них здесь сообщение называло бы стадией «выкат»,
    # а сломаны были бы тесты — человек шёл бы смотреть не туда.
    needs: [test, e2e, build, deploy]
    if: always()

    steps:
      # LEGACY-241. Чекаут ради одного файла — `scripts/notify_telegram.sh`. До 17.08.2026
      # у job'а `notify` его не было вовсе, и тело отправки жило здесь второй копией; это
      # было оправдано, пока отправитель был один. Их стало три (окно открыть, окно закрыть,
      # отказ), а сторож сверял копии по подстрокам — то есть замена `sed` на равный по
      # смыслу `printf` красила проверку, а расхождение по `--max-time` или `chat_id` не
      # красило ничего. Теперь отправитель ровно один, и спека это проверяет буквально:
      # `api.telegram.org` не должен встречаться в `.github/workflows/**` ни разу.
      #
      # ⚠️ Цена размена названа прямо: сигнал об упавшем выкате теперь зависит от того,
      # что чекаут отработал. Отказ чекаута красит сам job `notify`, то есть виден в
      # списке прогонов; путь через Alertmanager он не затрагивает вовсе — тот живёт на
      # сервере и про GitHub не знает.
      #
      # 🔴 `if: always()` обязателен, и это не перестраховка. Условие шага по умолчанию —
      # `success()`, а он ложен не только на отказе, но и **на отмене прогона**. Главный
      # потребитель этого чекаута — `🚨 Notify Cancelled`, который срабатывает ровно при
      # отмене: без `always()` чекаут пропускался бы именно тогда, когда нужен, и окно
      # выката оставалось бы открытым навсегда при зелёном job'е.
      #
      # 🔴 `ref` — ветка по умолчанию, а не выкатываемый тег. Скрипт здесь утилита, а не
      # часть релиза: повторный запуск прогона по старому тегу иначе остался бы без файла,
      # и сообщение об упавшем выкате не ушло бы никуда.
      - name: 📥 Checkout Notifier
        if: ${{ always() }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            scripts/notify_telegram.sh
          sparse-checkout-cone-mode: false

      # Успех наружу не уходит по решению владельца от 16.08.2026: сообщение
      # о каждом удачном выкате превращает канал в ленту, которую перестают
      # читать, и тогда в ней теряется отказ. В логе прогона он остаётся.
      # (Закрытие окна выката — не то же самое: его шлёт `📢 Deploy Window Closed`
      # в job `deploy`, и это сообщение про доступность сервиса, а не про успех.)
      - name: 📢 Notify Success
        if: ${{ needs.deploy.result == 'success' }}
        run: |
          echo "🎉 Deployment successful!"
          echo "Version: ${{ needs.build.outputs.version }}"
          echo "Environment: ${{ github.event.inputs.environment || 'production' }}"
          echo "URL: https://${{ vars.PRODUCTION_DOMAIN }}"

      # LEGACY-221. Второй путь доставки в тот же Telegram-канал, что и у
      # Alertmanager, и это не дублирование: Alertmanager живёт на сервере и про
      # GitHub не знает, раннер GitHub не видит хост. Отказ выката не виден ни
      # одному правилу мониторинга — приложение на сервере продолжает работать
      # на старом образе, все метрики зелёные, а новая версия просто не доехала.
      #
      # ⚠️ `continue-on-error` здесь намеренно НЕ ставится, хотя `LEGACY-221` его разрешал.
      # Он не нужен: `scripts/notify_telegram.sh` упасть не может — отсутствие секретов даёт
      # `exit 0`, сетевой отказ снят через `set +e`, обе ветки разбора кода ответа печатают
      # предупреждение и выходят нулём. А поставленный «на всякий случай», он погасил бы
      # единственный сигнал о поломке самого оповещения: после любой будущей правки скрипта
      # шаг был бы зелёным при полном молчании канала. Отказ Telegram выкат не красит и без него.
      #
      # ⚠️ Отсутствие самого скрипта под эту гарантию не подпадает и намеренно **не**
      # прикрыто проверкой `-f`, в отличие от шагов в job `deploy`. Там пропущенное
      # объявление — неудобство, здесь пропущенное сообщение об отказе — потеря
      # единственного сигнала, и она обязана краснеть job'ом `notify`.
      #
      # 🔴 Условие шире, чем `deploy.result == 'failure'`: при падении `test` или
      # `build` job `deploy` не запускается вовсе и получает `skipped`, а не
      # `failure` — с прежним условием отказ сборки не сообщался никуда. Отменённые
      # прогоны отсеиваются `!cancelled()`: отмена руками — не происшествие, а
      # сообщение о ней приучает не читать канал.
      #
      # 🔴 У `test` проверяется именно `== 'failure'`, а не `!= 'success'`, и это
      # не небрежность. Job `test` пропускается по собственному условию (`if:` в самом
      # начале job `test`) при осознанно поставленной галке `skip_tests` — это аварийный
      # выкат, а не отказ, и `skipped` в этом случае сообщать некуда. С `!= 'success'`
      # каждый такой выкат слал бы «Выкат упал · проверки (skipped)». Job `deploy` тот же
      # случай допускает явно, своим `if:`. Номера строк здесь не ставятся намеренно:
      # они уже дважды разъезжались с кодом от правок в этом же файле. Оба условия
      # закреплены спекой `src/devops/monitoring-wiring.spec.ts`.
      # До починки LEGACY-222 (16.08.2026) `skipped` приходил вообще на
      # каждом ручном запуске — строка `'false'` в `!github.event.inputs.skip_tests`
      # истинна; теперь пропуск бывает только по галке, но условие от этого не меняется.
      #
      # 🔴 Токен передаётся через `env`, а не подставляется в строку команды:
      # GitHub маскирует в логах только точные совпадения со значением секрета,
      # и токен, разрезанный переносом строки или склейкой, в лог попадёт целиком.
      # Ни `echo` токена, ни `set -x` в этом шаге быть не должно — то же правило
      # записано в шапке `scripts/notify_telegram.sh`, и спека проверяет оба места.
      #
      # 🔴 Версия тоже через `env`, а не `${{ }}` в теле: подстановка происходит до shell,
      # и свободный ввод `workflow_dispatch` вида `x" "$(...)` исполнился бы прямо здесь,
      # в шаге с токеном в окружении.
      - name: 🚨 Notify Failure
        # 🔴 `needs.e2e.result` добавлен 03.09.2026 вместе с переездом набора
        # (`LEGACY-364`): без него отказ e2e не поднимал уведомление вовсе, если
        # `deploy` при этом получал `skipped`, — выкат вставал молча.
        if: ${{ !cancelled() && (needs.test.result == 'failure' || needs.e2e.result == 'failure' || needs.build.result != 'success' || needs.deploy.result != 'success') }}
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_RESULT: ${{ needs.test.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          VERSION: ${{ needs.build.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # Первая по порядку сломавшаяся стадия — она и есть причина;
          # остальные после неё получают `skipped` и о причине ничего не говорят.
          if [[ "${TEST_RESULT}" == "failure" ]]; then
            STAGE="проверки (${TEST_RESULT})"
          # 🔴 `LEGACY-364`. Отдельная стадия, а не молчание: с переездом набора
          # отдельным job'ом упавшие e2e оставляют `deploy` в `skipped`, и без этой
          # ветки сообщение называло бы стадией «выкат» - человек шёл бы смотреть
          # логи выката, которого не было.
          elif [[ "${E2E_RESULT}" == "failure" ]]; then
            STAGE="e2e (${E2E_RESULT})"
          elif [[ "${BUILD_RESULT}" != "success" ]]; then
            STAGE="сборка (${BUILD_RESULT})"
          else
            STAGE="выкат (${DEPLOY_RESULT})"
          fi

          echo "❌ Deployment failed on stage: ${STAGE}"
          echo "Version: ${VERSION:-unknown}"
          echo "Check the logs: ${RUN_URL}"

          bash scripts/notify_telegram.sh \
            "Выкат упал · books · ${VERSION:-без версии}" \
            "Этап: ${STAGE}" \
            "${RUN_URL}"

      # 🔴 LEGACY-241. Третий путь закрытия окна — отмена прогона. Без него сценарий
      # такой: `📢 Deploy Window Opened` ушёл, прогон отменили руками, `📢 Deploy Window
      # Closed` пропущен по `success()`, `🚨 Notify Failure` — по `!cancelled()`, и
      # последним словом в канале навсегда остаётся «Админка и API недоступны несколько
      # минут». Это худший вид молчания: отмена рвёт ssh-клиент, а `deploy_production.sh`
      # на сервере может быть уже внутри `prisma migrate deploy`, то есть прод остаётся
      # в промежуточном состоянии — и именно об этом никто не узнаёт.
      #
      # ⚠️ `cancelled()`, а не `always()`: успех и отказ закрыты двумя шагами выше, и
      # третье сообщение на тех же исходах вернуло бы ленту. Шаг выполняется, потому что
      # job объявлен с `if: always()` — такие job'ы GitHub доводит до конца и на отмене.
      #
      # ⚠️ Условие не сужается до `needs.deploy.result == 'cancelled'`, но текст сообщения
      # разный. Один текст на оба случая был бы ложной тревогой: отмена на стадии `test`
      # или `build` до сервера не доходила вовсе, а «прод мог остаться посреди миграций»
      # погонит дежурного смотреть `_prisma_migrations` на нетронутом проде. Два-три таких
      # сообщения — и канал перестают читать, то есть ровно то, от чего защищались.
      # Различает их `needs.deploy.result`: `skipped` значит, что job `deploy` не
      # стартовал, всё остальное — что стартовал и был прерван.
      #
      # ⚠️ Проверки `-f` здесь нет намеренно, как и в `🚨 Notify Failure` выше: в этом
      # job'е пропавшее сообщение — потеря единственного сигнала, и она обязана краснеть.
      - name: 🚨 Notify Cancelled
        if: ${{ cancelled() }}
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          VERSION: ${{ needs.build.outputs.version }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          if [[ "${DEPLOY_RESULT}" == "skipped" ]]; then
            DETAIL="Прогон отменён до начала выката — прод не тронут."
          else
            DETAIL="Прогон отменён во время выката. Прод мог остаться посреди миграций — проверь состояние вручную."
          fi

          bash scripts/notify_telegram.sh \
            "Выкат прерван · books · ${VERSION:-без версии}" \
            "${DETAIL}" \
            "${RUN_URL}"

  # =====================================================
  # ROLLBACK (Manual trigger)
  # =====================================================

  rollback:
    name: ⏪ Emergency Rollback
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    # 🔴 LEGACY-227. `needs: [deploy]` обязателен, и не ради порядка запуска: у job
    # без зависимостей нет предков, и `failure()` в его условии не значит «что-то
    # упало раньше» — у него нет «раньше». Пока зависимости не было, job либо
    # не запускался никогда (и тогда врал комментарий про «автоматический откат»
    # у проверки живости), либо реагировал на отказ любой стадии. Второе стало
    # достижимым после починки LEGACY-222: до неё job `test` на ручном запуске
    # всегда получал `skipped`, а теперь может упасть — и упавший юнит-тест
    # переливал бы прод на предыдущую версию, при том что выката не было вовсе.
    #
    # Условие сужено до настоящего неудачного выката, и одного `needs.deploy.result
    # == 'failure'` для этого мало: он истинен при отказе **любого** шага job
    # `deploy`, включая checkout и настройку ssh-агента, которые идут до сервера.
    # Поэтому требуется ещё отметка `server_stage_reached` — её ставит шаг
    # `📍 Mark server stage reached` вплотную перед выкатом. Отменённые прогоны
    # отсеиваются `!cancelled()`: отмена руками не повод переливать прод.
    # Инвариант закреплён спекой `src/devops/monitoring-wiring.spec.ts`.
    #
    # 🔴 LEGACY-243. Ограничение `github.event_name == 'workflow_dispatch'` снято 18.08.2026.
    # Оно писалось, когда основным путём был push в `main`, а после `LEGACY-241` автоматический
    # путь остался один — тег `v*`, — и у него отката не было вовсе. Снимать это было нельзя до
    # ADR-018: откат здесь откатывает **образ**, а не схему, и полноценным откатом он становится
    # только при обратно совместимых миграциях. Теперь это правило держит шаг
    # `🧬 Migration Backwards-Compatibility Check` в обоих путях.
    #
    # Остальные три части условия сохранены дословно и снятию не подлежат: `!cancelled()`,
    # настоящий отказ выката, и отметка `server_stage_reached` — без неё откат срабатывал на
    # отказе checkout и переливал прод (`LEGACY-227`).
    needs: [deploy]
    if: ${{ !cancelled() && needs.deploy.result == 'failure' && needs.deploy.outputs.server_stage_reached == 'true' }}
    environment:
      name: production

    steps:
      - name: 🔑 Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: ⏪ Rollback Deployment
        run: |
          ssh -o StrictHostKeyChecking=no ${{ env.DEPLOY_USER }}@${{ vars.PRODUCTION_SERVER }} << 'EOF'
            set -euo pipefail
            
            echo "⏪ Starting emergency rollback..."
            # 🔴 Рабочее дерево лежит в `/opt/books/app/src` — это `DEPLOY_DIR` из самого
            # `deploy_production.sh:45` и тот же каталог, куда заходит шаг `🚀 Deploy to Server`.
            # До 18.08.2026 здесь стоял `/opt/books/app`, где скрипта нет: откат уходил в ветку
            # `else` и печатал «Rollback script not found!». Job срабатывал так редко
            # (только `workflow_dispatch` плюс отказ выката после отметки о сервере), что
            # мёртвую строку никто не наблюдал.
            cd /opt/books/app/src

            if [[ -f "./scripts/deploy_production.sh" ]]; then
              ./scripts/deploy_production.sh --rollback --force
              echo "✅ Rollback completed!"
            else
              echo "❌ Rollback script not found!"
              exit 1
            fi
          EOF
