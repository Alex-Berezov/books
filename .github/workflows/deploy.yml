name: 📦 Production Deployment

on:
  push:
    tags:
      - 'v*' # Triggers on tags like v1.0.0, v2.1.3, etc.
    branches:
      - main # Auto-deploy from main branch (optional)
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (tag, branch, or commit)'
        required: true
        default: 'main'
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      skip_tests:
        description: 'Skip tests (emergency deploy)'
        required: false
        type: boolean
        default: false
      skip_backup_emergency:
        description: 'Skip pre-deploy backup (emergency only!)'
        required: false
        type: boolean
        default: false

# Global workflow permissions
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: books-app
  DEPLOY_USER: deploy

jobs:
  # =====================================================
  # TESTING AND QUALITY CHECKS
  # =====================================================

  test:
    name: 🧪 Tests & Quality Checks
    runs-on: ubuntu-22.04
    if: ${{ !github.event.inputs.skip_tests }}

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: books_test
        # ⚠️ `max_connections` здесь не поднять: `services` в GitHub Actions не
        # принимает команду контейнера. Поэтому расход подключений ограничен со
        # стороны клиента — `connection_limit=5` на воркер в
        # `test/setup-after-env-e2e.ts`. Без него параллельный прогон падает с
        # «sorry, too many clients already», причём падает не тест, а случайный
        # запрос внутри него, и выглядит это как сломанный код.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # For semantic versioning

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: 🔧 Install Dependencies
        run: |
          yarn --frozen-lockfile
          yarn prisma generate

      - name: 📋 Lint & Type Check
        run: |
          yarn lint
          yarn typecheck

      - name: 🔀 Schema/Migration Drift Check
        run: |
          yarn drift-check:self-test
          yarn drift-check

      - name: ♻️ Cache Jest transform
        uses: actions/cache@v4
        with:
          path: /tmp/jest_rs
          key: jest-${{ runner.os }}-${{ hashFiles('yarn.lock', 'tsconfig.json') }}-${{ github.sha }}
          restore-keys: |
            jest-${{ runner.os }}-${{ hashFiles('yarn.lock', 'tsconfig.json') }}-
            jest-${{ runner.os }}-

      # ⚠️ `test:cov`, а не `test`: порог покрытия живёт в `jest.coverageThreshold`
      # и проверяется только при `--coverage`. Если здесь оставить `yarn test`,
      # порог будет краснеть в CI и молчать при выкате — ровно то расхождение
      # конвейеров, которое закрывал LEGACY-078 на фронте. Цена — прогон дольше
      # обычного, и она принята сознательно.
      - name: 🧪 Unit Tests (with coverage thresholds)
        run: yarn test:cov
        env:
          NODE_ENV: test

      - name: 🔧 Setup Test Database
        run: |
          yarn prisma migrate deploy
          yarn prisma db seed
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/books_test?schema=public

      # `--no-cache` убран (был добавлен 23.07.2026 вместе с подъёмом лимита
      # памяти — причина в коммите не записана, а транспиляция 68 наборов заново
      # стоит минуты). Кэш ts-jest живёт между прогонами через actions/cache ниже;
      # лимит памяти остаётся, так что прежняя защита от OOM не тронута.
      # 🔴 `test:e2e:serial` содержит `--runInBand`, который **переопределяет**
      # `maxWorkers` из конфига: с ним параллельность из `jest-e2e.json` не
      # включилась бы вовсе, и правка выглядела бы сделанной, ничего не ускорив.
      # Отдельный скрипт `test:e2e:parallel` без этого флага; `:serial` оставлен
      # для отладки, где важен предсказуемый порядок.
      - name: 🧪 E2E Tests
        # ⚠️ Число воркеров задано явно, а не через `50%` из конфига: у раннера
        # мало ядер, и доля легко даёт одного воркера — параллельность
        # «включена», а прогон идёт как прежде. `E2E_WORKERS` читает globalSetup,
        # чтобы создать ровно столько баз, сколько будет воркеров.
        run: yarn test:e2e:parallel --maxWorkers=2
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/books_test?schema=public
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          E2E_WORKERS: 2
          NODE_OPTIONS: --max-old-space-size=6144

  # =====================================================
  # DOCKER IMAGE BUILD
  # =====================================================

  # ⚠️ Сборка образа идёт ПАРАЛЛЕЛЬНО тестам, а не после них (10.08.2026).
  # Раньше `needs: [test]` держал её за 11 минутами проверок, хотя образ от их
  # исхода не зависит: выкат всё равно ждёт обоих (`deploy: needs [test, build]`),
  # и при красных тестах собранный образ просто не выкатывается. Экономия — вся
  # длительность сборки, около трёх минут из критического пути.
  build:
    name: 🏗️ Build Docker Image
    runs-on: ubuntu-22.04

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⬇️ Normalize repository to lowercase
        # Some actions/registries require lowercase image names. Persist as REPO_LOWER for later steps.
        run: |
          echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: 🔍 Extract Version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="main-$(git rev-parse --short HEAD)"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: 🔑 Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix={{branch}}-
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build and Push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_DATE=${{ github.run_id }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 📋 Generate SBOM
        uses: anchore/sbom-action@v0
        continue-on-error: true # Don't block deployment on SBOM errors
        with:
          image: ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}:${{ steps.version.outputs.version }}
          artifact-name: sbom-${{ steps.version.outputs.version }}.spdx.json
          output-file: ./sbom-${{ steps.version.outputs.version }}.spdx.json

      - name: 🔍 Security Scan
        uses: anchore/scan-action@v3
        continue-on-error: true # Don't block deployment on scan errors
        with:
          image: ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}:${{ steps.version.outputs.version }}
          fail-build: false # Don't stop deployment on medium vulnerabilities

  # =====================================================
  # PRODUCTION DEPLOYMENT
  # =====================================================

  deploy:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-22.04
    # Ждёт обоих: тесты больше не блокируют сборку, но по-прежнему блокируют выкат.
    needs: [test, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.test.result == 'success' || github.event.inputs.skip_tests) }}
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
      url: https://${{ vars.PRODUCTION_DOMAIN }}

    steps:
      - name: 📥 Checkout Deployment Scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/deploy_production.sh
            docker-compose.prod.yml
            .env.prod.template
          sparse-checkout-cone-mode: false

      - name: 🔑 Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: 📋 Prepare Deployment
        run: |
          echo "🔧 Deployment configuration:"
          echo "Version: ${{ needs.build.outputs.version }}"
          echo "Image: ${{ needs.build.outputs.image-tag }}"
          echo "Server: ${{ vars.PRODUCTION_SERVER }}"
          echo "Domain: ${{ vars.PRODUCTION_DOMAIN }}"

      - name: 🚀 Deploy to Server
        run: |
          # Lowercase repository name for Docker
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')

          # Connect to server and execute deployment
          ssh -o StrictHostKeyChecking=no ${{ env.DEPLOY_USER }}@${{ vars.PRODUCTION_SERVER }} << EOF
            set -euo pipefail
            
            echo "🔄 Preparing deployment environment..."
            cd /opt/books/app/src
            
            # Save local changes and update code
            if [[ -d ".git" ]]; then
              echo "📦 Stashing local changes..."
              git stash --include-untracked || true
              
              echo "🔄 Fetching latest code..."
              git fetch origin main
              
              echo "🔄 Updating to latest version..."
              git reset --hard origin/main
              
              echo "✅ Code updated successfully"
              chmod +x scripts/deploy_production.sh
            fi
            
            # Create .env.prod from secrets
            echo "📝 Creating .env.prod from secrets..."
            cat > .env.prod << 'ENVEOF'
          ${{ secrets.ENV_PROD }}
          ENVEOF
            chmod 600 .env.prod
            echo "✅ .env.prod created successfully"
            
            # Login to registry to pull image
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
            
            BACKUP_FLAG=""
            if [[ "${{ github.event.inputs.skip_backup_emergency }}" == "true" ]]; then
              echo "⚠️  EMERGENCY: Skipping pre-deploy backup!"
              BACKUP_FLAG="--no-backup"
            fi
            
            echo "🚀 Starting deployment..."
            ./scripts/deploy_production.sh \
              --image-tag "${{ needs.build.outputs.version }}" \
              --registry "${{ env.REGISTRY }}/${REPO_LOWER}" \
              --skip-git-update \
              --pull \
              $BACKUP_FLAG \
              --force
            
            echo "✅ Deployment completed!"
          EOF

      - name: 🏥 Health Check
        run: |
          echo "🏥 Running post-deployment health checks..."

          # The container healthcheck probes /api/metrics and the deploy script waits on it, so
          # "healthy" means the process listens — not that it ever talked to Postgres. Liveness
          # says the same and nothing more. The wait must therefore end on *readiness reporting
          # `status: up`*, otherwise verification races the app's first database query
          # (01.08.2026: readiness hung ~20 s and failed 14 s after container start).
          max_attempts=20
          attempt=0

          until
            curl -sf --max-time 20 "https://${{ vars.PRODUCTION_DOMAIN }}/api/health/liveness" > /dev/null &&
            [[ "$(curl -sf --max-time 20 "https://${{ vars.PRODUCTION_DOMAIN }}/api/health/readiness" | jq -r '.status // "down"')" == "up" ]]
          do
            # `$(( ))` in an assignment, not `((attempt++))` as a statement: the latter returns the
            # *old* value, so on the first iteration it exits 1 and `bash -e` kills the step before
            # a single retry happens. Same bug as the one fixed in scripts/deploy_production.sh.
            attempt=$((attempt + 1))
            if [[ $attempt -ge $max_attempts ]]; then
              echo "❌ Health check failed after $max_attempts attempts"
              curl -s --max-time 20 "https://${{ vars.PRODUCTION_DOMAIN }}/api/health/readiness" || true
              exit 1
            fi
            echo "⏳ Attempt $attempt/$max_attempts..."
            sleep 15
          done

          echo "✅ Service is healthy!"

      - name: 📊 Verify Deployment
        run: |
          echo "📊 Verifying deployment..."

          # Which image actually answers. `unknown` means the running container predates the
          # APP_VERSION plumbing — reported, but not treated as a failed deployment.
          api_version=$(curl -sf --max-time 20 "https://${{ vars.PRODUCTION_DOMAIN }}/api/health/liveness" | jq -r '.version // "unknown"')

          echo "🔍 API Version: $api_version"
          echo "🎯 Expected Version: ${{ needs.build.outputs.version }}"

          if [[ "$api_version" == "unknown" ]]; then
            echo "⚠️  Running container does not report its version — skipping the version check."
          elif [[ "$api_version" != "${{ needs.build.outputs.version }}" ]]; then
            echo "❌ Deployed version does not match the built one — the old container is still serving."
            exit 1
          fi

          # Check main endpoints. Retried: a single attempt right after a container swap tests the
          # timing of the deployment, not the health of the application.
          # `/api/metrics` used to be checked here. It is blocked at Caddy (403)
          # since 07.08.2026, so this loop would fail every deploy from now on —
          # and on a workflow_dispatch run that failure triggers the automatic
          # rollback below, undoing a perfectly good deployment. The endpoint is
          # not a health signal anyway: readiness is. See LEGACY-072.
          endpoints=(
            "/api/health/readiness"
          )

          for endpoint in "${endpoints[@]}"; do
            ok=false
            for attempt in 1 2 3 4 5; do
              if curl -sf --max-time 20 "https://${{ vars.PRODUCTION_DOMAIN }}$endpoint" > /dev/null; then
                ok=true
                break
              fi
              echo "⏳ $endpoint - attempt $attempt/5 failed, retrying..."
              sleep 10
            done

            if [[ "$ok" == true ]]; then
              echo "✅ $endpoint - OK"
            else
              echo "❌ $endpoint - FAILED"
              exit 1
            fi
          done

          echo "✅ All verifications passed!"

  # =====================================================
  # NOTIFICATIONS
  # =====================================================

  notify:
    name: 📢 Notifications
    runs-on: ubuntu-22.04
    needs: [build, deploy]
    if: always()

    steps:
      - name: 📢 Notify Success
        if: ${{ needs.deploy.result == 'success' }}
        run: |
          echo "🎉 Deployment successful!"
          echo "Version: ${{ needs.build.outputs.version }}"
          echo "Environment: ${{ github.event.inputs.environment || 'production' }}"
          echo "URL: https://${{ vars.PRODUCTION_DOMAIN }}"

          # Here you can add integrations with:
          # - Slack (webhook)
          # - Discord
          # - Telegram
          # - Email

      - name: 🚨 Notify Failure
        if: ${{ needs.deploy.result == 'failure' }}
        run: |
          echo "❌ Deployment failed!"
          echo "Version: ${{ needs.build.outputs.version }}"
          echo "Check the logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # =====================================================
  # ROLLBACK (Manual trigger)
  # =====================================================

  rollback:
    name: ⏪ Emergency Rollback
    runs-on: ubuntu-22.04
    if: failure() && github.event_name == 'workflow_dispatch'
    environment:
      name: production

    steps:
      - name: 🔑 Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: ⏪ Rollback Deployment
        run: |
          ssh -o StrictHostKeyChecking=no ${{ env.DEPLOY_USER }}@${{ vars.PRODUCTION_SERVER }} << 'EOF'
            set -euo pipefail
            
            echo "⏪ Starting emergency rollback..."
            cd /opt/books/app
            
            if [[ -f "./scripts/deploy_production.sh" ]]; then
              ./scripts/deploy_production.sh --rollback --force
              echo "✅ Rollback completed!"
            else
              echo "❌ Rollback script not found!"
              exit 1
            fi
          EOF
