name: 🔔 Telegram delivery check
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - name: Send a test message
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ -z "${TG_TOKEN}" || -z "${TG_CHAT}" ]]; then
            echo "::error::секреты не видны этому job"
            exit 1
          fi
          TEXT="<b>Проверка канала из конвейера</b>"$'\n'"books · путь LEGACY-221"$'\n'"${RUN_URL}"
          set +e
          HTTP_CODE=$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' \
            "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=${TEXT}")
          set -e
          echo "HTTP ${HTTP_CODE}"
          [[ "${HTTP_CODE}" == "200" ]]
