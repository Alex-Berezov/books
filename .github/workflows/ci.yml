name: CI (portable)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 🔴 LEGACY-240. Три push подряд в ветку запроса на слияние давали три параллельных
# прогона `e2e`, каждый со своими postgres и redis, и все держали раннеры до конца.
#
# 🔴 Ключевое: push в `main` в группу **не попадает вовсе**, и это не то же самое, что
# `cancel-in-progress: false`. Очередь GitHub в группе глубиной один — в ней держится
# один выполняющийся прогон и один ожидающий, а третий, встав в очередь, **отменяет
# ожидавшего**, независимо от `cancel-in-progress` (тот управляет только отменой
# выполняющегося). Тот же механизм расписан в `deploy.yml` по `LEGACY-249`, где он
# приемлем: пропущенный выкат тега — это отложенный релиз. Здесь он недопустим: три
# слияния за 6–9 минут прогона `e2e` оставили бы средний коммит `main` без единого
# job'а — ни `yarn ci`, ни e2e, ни сборки образа, — и заметить это было бы нечем,
# наблюдатель за очередью слушает только выкат. Поэтому суффикс группы для не-`pull_request`
# событий — `github.run_id`: он уникален на прогон, то есть каждый push в `main` получает
# собственную группу и ни с кем не соревнуется.
#
# ⚠️ Для `pull_request` суффикс постоянный (`pr`), иначе уникальная группа выключила бы
# отмену устаревших прогонов целиком — то есть вернула бы ровно `LEGACY-240`. Обе
# половины держит спека `src/devops/deploy-trigger.spec.ts`: строка группы сверяется
# равенством, потому что здесь ошибиться можно в обе стороны и обе тихие.
#
# ⚠️ Группа включает `github.ref` и в отличие от `deploy.yml` (`LEGACY-245`) обязана его
# включать: там группа-константа выстраивает выкаты в очередь на весь репозиторий, здесь
# общая группа заставила бы прогон одной ветки отменять прогон другой.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Run portable CI script
        run: |
          yarn --version
          yarn ci
        env:
          CI: true
          # LEGACY-149. Остаётся '0' сознательно, и это больше не пробел: e2e гоняет
          # соседний job `e2e`, где postgres и redis подняты сервисами runner'а.
          # Ветка e2e внутри `scripts/ci.sh` зовёт `test:e2e:serial` (`--runInBand`),
          # то есть все 72 набора строго подряд; включённая здесь, она отодвинула бы
          # ответ линта и typecheck на всю длительность прогона и сделала бы ту же
          # работу медленнее. Сам скрипт остаётся портируемым: где базы нет, там
          # ветка просто не включается.
          #
          # 🔴 Ставить сюда '1' без `DATABASE_URL` нельзя: `scripts/ci.sh` в этом
          # случае печатает «skipping e2e» и идёт дальше зелёным, а конвейер
          # выглядит включённым — тот же дефект, только с галкой. Сторож —
          # `src/devops/ci-e2e-wiring.spec.ts`.
          CI_E2E: '0'

  # LEGACY-149. До 17.08.2026 на pull request не выполнялся ни один из 72 наборов
  # `test/*.e2e-spec.ts`: единственный job звал `yarn ci` с `CI_E2E: '0'`, а
  # настоящий прогон жил в `deploy.yml`, который срабатывал уже после слияния —
  # на push в `main` и на теге `v*` (с 17.08.2026 push оттуда снят, остался только
  # тег и ручной запуск — `LEGACY-241`). Регрессия в маршруте, миграции или порядке
  # регистрации модулей краснела в конвейере выката, то есть на горячем пути.
  #
  # Дублирование прогона с `deploy.yml` намеренное и не подлежит «оптимизации»:
  # `ci.yml` не запускается по тегу `v*`, а `deploy.yml` — на pull request, и шаг,
  # заведённый только в одном, на втором пути отсутствует молча (LEGACY-207, 209).
  #
  # Отдельным job'ом, а не шагом внутри `build`: прогон занимает 6–9 минут при
  # тёплом кэше ts-jest (на холодном дольше — 72 набора транспилируются заново) и
  # идёт параллельно линту, typecheck и сборке, ничего не удлиняя.
  e2e:
    name: E2E (postgres + redis)
    # ⚠️ Пришпилено к той же версии, что и job `test` в `deploy.yml`, а не
    # `ubuntu-latest`: тот сегодня 24.04 и переедет дальше сам, а Prisma тянет
    # движки под системные библиотеки раннера. Разойдутся версии — прогон на
    # слиянии перестанет отвечать на вопрос «пройдёт ли то же самое на выкате».
    runs-on: ubuntu-22.04
    # Прогон укладывается в 6–9 минут; зависший на блокировке базы без этой
    # строки держал бы раннер дефолтные 360 минут, и очередь встала бы вся.
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: books_test
        # ⚠️ `max_connections` здесь не поднять: `services` в GitHub Actions не
        # принимает команду контейнера, а у `postgres:14` он по умолчанию 100.
        #
        # 🔴 Расход подключений держится числом воркеров, и только им. Соседний
        # комментарий в `deploy.yml` называет потолком `connection_limit=5` из
        # `test/setup-after-env-e2e.ts` — это параметр движка Prisma, а клиент
        # собран на драйверном адаптере (`src/prisma/prisma.service.ts`:
        # `new Pool({ connectionString })` без `max`), и `pg` его не читает.
        # Поэтому `--maxWorkers` выше двух упирается в «sorry, too many clients
        # already», причём падает не тест, а случайный запрос внутри него, и
        # выглядит это как сломанный код.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: |
          yarn install --frozen-lockfile
          yarn prisma:generate

      # Кэш транспиляции ts-jest: без него каждый pull request заново собирает все
      # 72 набора, и это заметная часть прогона. Путь тот же, что в `deploy.yml`.
      # ⚠️ Префикс ключа **свой** (`jest-e2e-ci-`), а не общий с `deploy.yml`: на
      # push в `main` оба конвейера идут одновременно и писали бы один и тот же
      # ключ, а второй получал бы отказ сохранения.
      - name: Cache Jest transform
        uses: actions/cache@v4
        with:
          path: /tmp/jest_rs
          key: jest-e2e-ci-${{ runner.os }}-${{ hashFiles('yarn.lock', 'tsconfig.json') }}-${{ github.sha }}
          restore-keys: |
            jest-e2e-ci-${{ runner.os }}-${{ hashFiles('yarn.lock', 'tsconfig.json') }}-
            jest-e2e-ci-${{ runner.os }}-

      # Отдельного шага `prisma migrate deploy` + `prisma db seed` здесь нет
      # намеренно: `test/setup-e2e.ts` сам создаёт базу-шаблон, накатывает на неё
      # миграции и seed и копирует её `CREATE DATABASE ... TEMPLATE` на каждый
      # воркер. База `books_test` из сервиса участвует только как адрес — из неё
      # берутся хост, порт и учётные данные, а подключение идёт к `/postgres`.
      # Шаг против самой `books_test` повторил бы миграции и seed вхолостую.
      # Сломанная миграция краснеет и так: `globalSetup` накатывает её первой.
      #
      # ⚠️ `E2E_WORKERS` обязан совпадать с `--maxWorkers`: столько баз создаёт
      # `globalSetup`, а `setup-after-env-e2e.ts` раскладывает воркеров по ним по
      # кругу. Воркеров больше баз — два набора пишут в одну базу и портят данные
      # друг другу, а прогон при этом чаще зелёный, чем красный (10.08.2026:
      # совпали только три места с общей сущностью).
      #
      # `NODE_OPTIONS` здесь не задаётся: скрипт `test:e2e:parallel` выставляет
      # свой (`--max-old-space-size=8192 --expose-gc`) прямо в команде, и он
      # перекрывает любое значение из окружения job'а.
      - name: E2E tests
        run: yarn test:e2e:parallel --maxWorkers=2
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/books_test?schema=public
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          E2E_WORKERS: 2

  # 🔴 LEGACY-241. Сборка образа на пути слияния. До 17.08.2026 её делала job `build` в
  # `deploy.yml`, срабатывавшая на каждый push в `main`; со снятием того триггера сборка
  # ушла бы с пути слияния целиком, и поломка `Dockerfile` впервые краснела бы на теге —
  # то есть в момент релиза, когда окно выката уже объявлено в канал. Это ровно тот класс
  # «шаг заведён только на одном пути», который закрывали LEGACY-078, 207 и 209.
  #
  # ⚠️ Отдельным job'ом и здесь, а не шагом в `scripts/ci.sh`: скрипт зовут ещё и локально
  # перед сдачей, а холодная сборка образа тянет полный `yarn install` из сети и добавляет
  # минуты к каждому прогону. В job'е доступен кэш слоёв `type=gha`, которого у голого
  # `docker build` нет вовсе.
  #
  # ⚠️ `push: false` и `target: runner`: проверяется собираемость, а не публикация.
  # Настоящий образ по-прежнему собирает и пушит job `build` в `deploy.yml`; `target`
  # там не задан, поэтому стадия совпадает ровно пока `runner` — конечная стадия
  # `Dockerfile`. Что она конечная, проверяет `src/devops/deploy-trigger.spec.ts`.
  #
  # ⚠️ `build-args` те же, что в `deploy.yml`: без них проверялась бы другая сборка.
  image:
    name: Docker image (build only)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ⚠️ `load: true` и `tags:` заведены ради двух шагов ниже (`LEGACY-248`): без
      # загрузки в демон собранный образ существует только слоями в кэше buildx, и
      # сканеру его нечем открыть. В реестр по-прежнему не уходит ничего — `push: false`.
      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: runner
          push: false
          load: true
          tags: books-app:ci-${{ github.sha }}
          build-args: |
            BUILD_DATE=${{ github.run_id }}
            VCS_REF=${{ github.sha }}
            VERSION=ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 🔴 LEGACY-248. Оба шага жили только в job `build` файла `deploy.yml`. До
      # `LEGACY-241` та срабатывала на каждый push в `main`, и состав образа с его
      # уязвимостями описывался при каждом слиянии; со снятием триггера отчёт стал
      # появляться только на теге — то есть в момент, когда решение о релизе уже принято,
      # а смотрят его как раз на запросе на слияние.
      #
      # ⚠️ Это **наблюдение, а не гейт**, и `continue-on-error: true` здесь стоит
      # сознательно, как и на теговом пути: отказ самого сканера (сеть, база уязвимостей)
      # не должен краснеть слиянием. Из этого следует, что покраснеть шаг не может по
      # построению, а значит пропажу шага не заметит никто, — поэтому его наличие в обоих
      # путях держит спека `src/devops/deploy-trigger.spec.ts`, а не конвейер.
      #
      # ⚠️ Образ берётся локальный (`books-app:ci-<sha>`), в реестр за ним не ходят:
      # путь слияния ничего не публикует, и `LEGACY-241` это закрепляет отдельным кейсом.
      - name: 📋 Generate SBOM
        uses: anchore/sbom-action@v0
        continue-on-error: true
        with:
          image: books-app:ci-${{ github.sha }}
          artifact-name: sbom-ci-${{ github.sha }}.spdx.json
          output-file: ./sbom-ci-${{ github.sha }}.spdx.json

      - name: 🔍 Security Scan
        id: scan
        uses: anchore/scan-action@v3
        continue-on-error: true
        with:
          image: books-app:ci-${{ github.sha }}
          fail-build: false

      # 🔴 Без этого шага «наблюдение» оставалось словом: отчёт скана лежал бы только
      # в сыром логе job'а, а при отказе самого сканера (сеть, база уязвимостей) шаг
      # зелёный и в логе нет вообще ничего — отличить это от чистого образа нельзя.
      # SBOM выкладывается сам (`artifact-name` выше), скану нужен отдельный шаг.
      #
      # 🔴 Условие проверяет **непустой выход**, а не только `always()`. `anchore/scan-action`
      # выставляет `sarif` лишь после успешной записи отчёта; при отказе сканера выход пуст,
      # а `path` у `actions/upload-artifact@v4` читается как `required: true` и на пустой
      # строке падает с `Input required and not supplied: path`. То есть шаг, заведённый
      # ради наблюдаемости отказа сканера, красил бы job именно при отказе сканера — и
      # блокировал слияние. `if-no-files-found` этот случай не покрывает: он про непустой
      # путь без совпадений, а разбор входа идёт раньше.
      #
      # Тот же путь достижим ещё дважды: при поломке `Dockerfile` (шаг сборки красный,
      # `always()` всё равно запускает выгрузку, и последней ошибкой job'а становится
      # `Input required` вместо настоящей) и при отмене устаревшего прогона запроса на
      # слияние — скан снимается посреди работы, выход не выставлен.
      #
      # ⚠️ `continue-on-error: true` — вторая линия к тому же: сам по себе шаг выгрузки
      # тоже наблюдение, и его отказ не повод краснеть слиянием.
      - name: 📤 Upload Scan Report
        if: always() && steps.scan.outputs.sarif != ''
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: vuln-scan-ci-${{ github.sha }}
          path: ${{ steps.scan.outputs.sarif }}
          if-no-files-found: warn
