services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: books-app:prod
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      PORT: ${PORT:-5000}
      HOST: 0.0.0.0
      # Set by scripts/deploy_production.sh from the deployed image tag; reported by liveness.
      APP_VERSION: ${APP_VERSION:-unknown}
    # Port 5000 is accessible only on localhost for the Caddy reverse proxy
    volumes:
      - uploads_data_prod:/app/var/uploads
      # WP-9: приватное хранилище юридических файлов прав (`RIGHTS_FILES_LOCAL_DIR`).
      # Отдельный том, а не подкаталог uploads: uploads раздаётся статикой, а отчёт о правах
      # публичного адреса иметь не должен (ADR-015). Том нужен даже при `STORAGE_DRIVER=r2` —
      # иначе откат на local тихо сложил бы юридические документы внутрь контейнера, и
      # ближайший редеплой их уничтожил бы, вопреки ADR-009.
      - rights_files_data_prod:/app/var/rights-files
    ports:
      - '127.0.0.1:${PORT:-5000}:5000'
    depends_on:
      - postgres
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "require('http').get('http://localhost:5000/api/metrics',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  postgres:
    image: postgres:14
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-books}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    # ports: не публиковать наружу в production
    # Backend подключается через service name postgres внутри Docker network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data_prod:
  uploads_data_prod:
  rights_files_data_prod:
