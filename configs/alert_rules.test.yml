# Кейсы для `promtool test rules configs/alert_rules.test.yml`.
#
# Зачем это существует. `promtool check rules` проверяет синтаксис, и правило с
# верным синтаксисом может не сработать никогда: 16.08.2026 оба гео-правила были
# написаны без `sum(...)`, PromQL не нашёл пары рядов по меткам (`header` у одного
# ряда, пусто у другого) и выражение молча становилось пустым. Зелёный конвейер,
# мёртвое правило — то же, за что снято `BooksAppHealthProbeDown` (`LEGACY-220`).
# Здесь в правила подставляются настоящие ряды и проверяется, срабатывают ли они.
#
# Покрыты правила, добавленные пачкой «Оповещения», и `HighErrorRate`.
#
# ⚠️ `recording_rules.yml` подключён с 17.08.2026 и обязателен: `HighErrorRate`
# читает `books_app:http_server_error_ratio:rate5m` и `books_app:http_requests:increase5m`.
# Без этого файла выражение пусто, алерт молчит всегда, и любой кейс на него
# зелёный по построению — ровно та мёртвая проверка, ради которой файл заведён.
rule_files:
  - recording_rules.yml
  - alert_rules.yml

evaluation_interval: 1m

tests:
  # Источник работает: один запрос без страны на шестьдесят с ней — 0.016 против
  # порога 0.05.
  - interval: 1m
    name: geo source healthy — no alert
    input_series:
      - series: 'geo_country_resolved_total{header="cf-ipcountry"}'
        values: '0+60x30'
      - series: 'geo_country_unknown_total'
        values: '0+1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: GeoCountrySourceDegraded
        exp_alerts: []
      - eval_time: 20m
        alertname: GeoCountrySourceUnavailable
        exp_alerts: []

  # Деградация: каждый пятый запрос без страны — 0.2 против порога 0.05.
  # Ловит именно то, что ломалось без `sum(...)`: слева ряд с меткой `header`,
  # справа — без меток.
  #
  # Молчание `GeoCountrySourceUnavailable` проверяется здесь же и обязательно:
  # без этой строки можно выбросить из правила половину
  # `sum(rate(resolved)) == 0 and`, и весь файл останется зелёным, а в проде
  # critical будет уходить при живом источнике на любых 20 запросах без страны.
  - interval: 1m
    name: geo source degraded — warning fires, critical stays silent
    input_series:
      - series: 'geo_country_resolved_total{header="cf-ipcountry"}'
        values: '0+40x30'
      - series: 'geo_country_unknown_total'
        values: '0+10x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: GeoCountrySourceDegraded
        exp_alerts:
          - exp_labels:
              severity: warning
              service: books-app
            exp_annotations:
              summary: 'Geo country source degraded'
              description: 'Share of requests without a country is 20% over 5m'
      - eval_time: 20m
        alertname: GeoCountrySourceUnavailable
        exp_alerts: []

  # Полная пропажа: ряда `resolved` не существует вовсе — prom-client не публикует
  # счётчик с метками до первого `inc`. Проверяет и `or vector(0)`, и порог объёма
  # у самой границы: 5 запросов в минуту дают прирост 25 за окно 5m при пороге 20.
  #
  # Warning здесь тоже firing (доля равна единице) — это ожидаемо: два сообщения
  # об одном инциденте разводит `inhibit_rules` в alertmanager.yml, а не правило.
  - interval: 1m
    name: geo source gone — critical fires just past the sample floor
    input_series:
      - series: 'geo_country_unknown_total'
        values: '0+5x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: GeoCountrySourceUnavailable
        exp_alerts:
          - exp_labels:
              severity: critical
              service: books-app
            exp_annotations:
              summary: 'Geo country source is gone'
              description: 'No request resolved a country in 5m while countryless traffic continues'

  # Ночной провал трафика: два запроса без страны в минуту, прирост за окно — 10
  # при пороге 20. Это не отвал источника, critical обязан промолчать.
  #
  # 🔴 Прирост, а не постоянное значение: ряд вида `1x30` стоит на единице и даёт
  # `increase` = 0, то есть кейс был бы зелёным при любом пороге, включая `>= 1`,
  # и порог не проверял бы вовсе.
  - interval: 1m
    name: geo source quiet at night — below the sample floor, both stay silent
    input_series:
      - series: 'geo_country_unknown_total'
        values: '0+2x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: GeoCountrySourceUnavailable
        exp_alerts: []
      # Доля здесь равна единице, то есть без порога объёма warning бы сработал.
      # Эта строка и есть проверка того, что порог у ratio-правила существует.
      - eval_time: 20m
        alertname: GeoCountrySourceDegraded
        exp_alerts: []

  # Ночь 17.08.2026 ровно как она была: живого трафика нет, кто-то перебирает
  # адреса и собирает 404. Прежнее правило считало это стопроцентной долей
  # ошибок и будило владельца трижды за ночь.
  - interval: 1m
    name: night 404 storm — client errors do not page
    input_series:
      - series: 'http_request_duration_seconds_count{status_code="404", method="GET", route="/api/x"}'
        values: '0+6x40'
    alert_rule_test:
      - eval_time: 25m
        alertname: HighErrorRate
        exp_alerts: []

  # Настоящий отказ: три пятисотых на семь двухсотых, объём выше порога.
  - interval: 1m
    name: server errors with real traffic — fires
    input_series:
      - series: 'http_request_duration_seconds_count{status_code="500", method="GET", route="/api/x"}'
        values: '0+3x40'
      - series: 'http_request_duration_seconds_count{status_code="200", method="GET", route="/api/x"}'
        values: '0+7x40'
    alert_rule_test:
      - eval_time: 25m
        alertname: HighErrorRate
        exp_alerts:
          - exp_labels:
              severity: critical
              service: books-app
            exp_annotations:
              summary: 'High HTTP error rate'
              description: 'Server error rate is 30% over the last 5 minutes'

  # 🔴 Порог объёма отдельным кейсом: доля 50%, но наблюдений за окно всего 10
  # при пороге 20. Без этой строки порог можно снять целиком, и файл останется
  # зелёным — а ночные звонки вернутся на первом же одиноком 500.
  - interval: 1m
    name: server errors at night — below the sample floor, stays silent
    input_series:
      - series: 'http_request_duration_seconds_count{status_code="500", method="GET", route="/api/x"}'
        values: '0+1x40'
      - series: 'http_request_duration_seconds_count{status_code="200", method="GET", route="/api/x"}'
        values: '0+1x40'
    alert_rule_test:
      - eval_time: 25m
        alertname: HighErrorRate
        exp_alerts: []

  # 🔴 LEGACY-231. Спокойный час: трафик идёт, ошибок нет ни одной. Обе доли обязаны
  # СУЩЕСТВОВАТЬ и быть равны нулю — а не отсутствовать.
  #
  # Отсутствие ряда и ноль в Prometheus — разные вещи, и на алертах эта разница не
  # видна: пустой вектор порога не превышает, `HighErrorRate` молчит одинаково в обоих
  # случаях. Видна она на дашбордах, где «No data» неотличимо от «сбор метрик отвалился».
  # Поэтому кейс проверяет саму запись через `promql_expr_test`, а не поведение алерта:
  # `alert_rule_test` с `exp_alerts: []` здесь был бы зелёным и до правки.
  #
  # Входной ряд — только двухсотые: ряда с `status_code=~"5.."` не существует вовсе,
  # ровно как `prom-client` и ведёт себя до первой ошибки такого вида. Без `or vector(0)`
  # у числителя оба выражения дают пустой результат, и `exp_samples` с одним образцом
  # не совпадает — кейс краснеет.
  - interval: 1m
    name: traffic without errors — both ratios are zero, not absent (LEGACY-231)
    input_series:
      - series: 'http_request_duration_seconds_count{status_code="200", method="GET", route="/api/x"}'
        values: '0+60x30'
    promql_expr_test:
      # ⚠️ `labels` — имя записи, а не `'{}'`: результат recording rule несёт
      # `__name__`, и пустой набор меток с ним не совпадает. Первая редакция кейса
      # на этом краснела при верном конфиге (`exp: {} 0E+00` против
      # `got: {__name__="books_app:..."} 0E+00`).
      - expr: books_app:http_server_error_ratio:rate5m
        eval_time: 20m
        exp_samples:
          - labels: 'books_app:http_server_error_ratio:rate5m'
            value: 0
      - expr: books_app:http_error_ratio:rate5m
        eval_time: 20m
        exp_samples:
          - labels: 'books_app:http_error_ratio:rate5m'
            value: 0
    # И обратная сторона: нулевая доля не будит. Без этой строки можно было бы
    # «починить» пустоту чем угодно, вплоть до подстановки единицы.
    alert_rule_test:
      - eval_time: 20m
        alertname: HighErrorRate
        exp_alerts: []

  # ⚠️ Трафика нет вовсе — доли действительно нет, и это НЕ дефект: `or vector(0)`
  # стоит только у числителя. Кейс держит границу правки `LEGACY-231`: обёрнутый
  # «для симметрии» знаменатель дал бы `vector(0) / vector(0)`, то есть **`NaN`** —
  # валидный образец, который уедет на панель вместо честной пустоты. Именно `NaN`,
  # а не `+Inf`: числитель — подмножество знаменателя по тем же рядам, поэтому
  # «ненулевое делить на ноль» тут структурно невозможно.
  #
  # ⚠️ `node_textfile_scrape_error` в вычислении доли не участвует и взят только
  # затем, чтобы кейс имел хоть какой-то вход: значение имеет ровно одно —
  # отсутствие рядов `http_request_duration_seconds_count`.
  - interval: 1m
    name: no traffic at all — ratio stays absent, not NaN (LEGACY-231)
    input_series:
      - series: 'node_textfile_scrape_error'
        values: '0x30'
    promql_expr_test:
      - expr: books_app:http_server_error_ratio:rate5m
        eval_time: 20m
        exp_samples: []
      - expr: books_app:http_error_ratio:rate5m
        eval_time: 20m
        exp_samples: []

  # Битый `.prom` в каталоге коллектора.
  - interval: 1m
    name: broken textfile collector
    input_series:
      - series: 'node_textfile_scrape_error'
        values: '1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: NodeTextfileCollectorBroken
        exp_alerts:
          - exp_labels:
              severity: warning
              service: monitoring
            exp_annotations:
              summary: 'Textfile collector cannot read its directory'
              description: 'node-exporter failed to parse a *.prom file: every textfile metric is dropped, including the backup timestamp'

  # Ночной бэкап не прошёл: отметке больше 26 часов. Главное правило LEGACY-219 —
  # без этого кейса порог можно поменять на любой, и файл останется зелёным.
  # В promtool `time()` стартует с нуля, поэтому ряд со значением 0 в момент 27h
  # даёт возраст 27 часов.
  #
  # 🔴 Шаг ряда — минута, а не час, и это не расточительство. Мгновенный селектор
  # видит образец не старше пяти минут (lookback delta), а правило вычисляется раз
  # в минуту (`evaluation_interval`). При часовом шаге выражение пусто во все
  # минуты, кроме тех, где стоит образец, состояние `for: 10m` сбрасывается,
  # и алерт не набирает нужного времени: got:[] при верном выражении.
  - interval: 1m
    name: nightly backup did not run — stale fires
    input_series:
      - series: 'books_backup_last_success_timestamp_seconds{kind="daily"}'
        values: '0x1630'
    alert_rule_test:
      - eval_time: 27h
        alertname: DatabaseBackupStale
        exp_alerts:
          - exp_labels:
              severity: critical
              service: backup
              kind: daily
            exp_annotations:
              summary: 'Nightly database backup did not run'
              description: 'Last successful daily backup was 1d 3h 0m 0s ago'
      - eval_time: 27h
        alertname: DatabaseBackupMetricMissing
        exp_alerts: []

  # Бэкап идёт по расписанию: отметка обновляется каждый час вместе с `time()`.
  - interval: 1m
    name: nightly backup is fresh — no alert
    input_series:
      - series: 'books_backup_last_success_timestamp_seconds{kind="daily"}'
        values: '0+60x1630'
    alert_rule_test:
      - eval_time: 27h
        alertname: DatabaseBackupStale
        exp_alerts: []

  # Канал доставки отказал: Alertmanager не может отправить уведомление.
  # Метка `integration` попадает в алерт из ряда — на неё ссылается аннотация.
  - interval: 1m
    name: alertmanager cannot deliver
    input_series:
      - series: 'alertmanager_notifications_failed_total{integration="telegram"}'
        values: '0+1x40'
    alert_rule_test:
      - eval_time: 25m
        alertname: AlertmanagerNotificationsFailing
        exp_alerts:
          - exp_labels:
              severity: critical
              service: monitoring
              integration: telegram
            exp_annotations:
              summary: 'Alertmanager cannot deliver notifications'
              description: 'Failed notifications to telegram for more than 10 minutes'

  # Alertmanager не отвечает.
  - interval: 1m
    name: alertmanager down
    input_series:
      - series: 'up{job="alertmanager"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: AlertmanagerDown
        exp_alerts:
          # `job` здесь не лишний: правило `up{job="alertmanager"} == 0` не агрегирует,
          # поэтому алерт наследует все метки ряда. `promtool` сверяет набор меток
          # точно, а не подмножеством, и пропуск любой из них красит прогон.
          - exp_labels:
              severity: critical
              service: monitoring
              job: alertmanager
            exp_annotations:
              summary: 'Alertmanager is down'
              description: 'Alertmanager has been unreachable for more than 2 minutes: nothing is being delivered'

  # Серии бэкапа нет вовсе: коллектор не настроен или скрипт ни разу не отработал.
  # Единственное, что это ловит, — `absent()`; выражение на возраст молчит.
  - interval: 1h
    name: no backup metric at all — absent fires
    input_series:
      - series: 'up{job="node-exporter"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 30h
        alertname: DatabaseBackupMetricMissing
        exp_alerts:
          # `absent()` переносит в результат равенства из селектора, поэтому у алерта
          # есть `kind="daily"` — по той же причине, что и `job` в кейсе выше.
          - exp_labels:
              severity: critical
              service: backup
              kind: daily
            exp_annotations:
              summary: 'No backup metric at all'
              description: 'node-exporter reports no daily backup timestamp: the textfile collector or the backup script is not wired'
