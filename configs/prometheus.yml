global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'books-app'
    environment: 'production'

# Пути относительные и резолвятся от каталога **этого файла**, а не от рабочего
# каталога процесса: внутри контейнера это `/cfg` (LEGACY-224). Абсолютный путь
# здесь пришлось бы менять при каждой смене точки монтирования. Что файлы
# действительно находятся, проверяет шаг `promtool check config` в `scripts/ci.sh`
# и парный в `deploy.yml`: он монтирует в тот же `/cfg` копию этого каталога,
# а рядом отдельным каталогом `/secrets` — пустышку вместо токена, и падает,
# если `rule_files` указывает в пустоту. Что перечислены все наборы правил
# из `configs/` — `src/devops/monitoring-wiring.spec.ts`.
rule_files:
  - 'alert_rules.yml'
  - 'recording_rules.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  # Метрики приложения. Job был отключён 08.08.2026 вместе с закрытием
  # `/api/metrics` гвардом `admin` (LEGACY-072) — и приложение осталось без
  # метрик вовсе. Возвращён 10.08.2026 (LEGACY-095) через долгоживущий
  # `METRICS_TOKEN`: Prometheus умеет статический bearer, не годился именно JWT
  # с его 12 часами жизни.
  #
  # ⚠️ Цель — внутреннее имя контейнера в сети приложения, а не публичный адрес:
  # маршрут метрик наружу не выставлен и выставляться не должен.
  - job_name: 'books-app'
    static_configs:
      - targets: ['app:5000']
    metrics_path: '/api/metrics'
    scrape_interval: 30s
    scrape_timeout: 10s
    authorization:
      type: Bearer
      # LEGACY-226: секрет лежит вне репозитория и монтируется отдельным каталогом
      # `/secrets`, видимым только этому сервису (`docker-compose.monitoring.yml`).
      # Каталогом, а не файлом: при пофайловом монтаже скрейп три дня жил
      # на токене, которого на диске уже не было — bind-mount держал прежний inode
      # (LEGACY-224).
      credentials_file: /secrets/metrics_token

  # Scrape Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 15s

  # Scrape Node Exporter (system metrics)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 15s

  # LEGACY-096. Сам канал доставки тоже нужно наблюдать: до этой цели ни одна
  # серия не говорила, доходят ли сообщения. Отозванный токен, бот, выкинутый
  # из канала, или упавший контейнер выглядели одинаково — тишиной, неотличимой
  # от «ничего не случилось».
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']
    scrape_interval: 30s

  # 🔴 Здесь стоял job `books-app-health`, скребущий `/api/health/readiness`.
  # Маршрут отдаёт **JSON**, а Prometheus ждёт текстовый exposition-формат:
  # цель была бы вечно красной, а `up == 0` читался бы как «приложение лежит».
  # Живость приложения теперь видна по job `books-app` выше: он снимает
  # настоящие метрики, и его `up` означает то, что должен означать.
