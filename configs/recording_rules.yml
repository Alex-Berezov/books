# Recording rules — предвычисленные ряды для частых запросов.
#
# 🔴 Лежали секцией `recording_rules:` внутри `prometheus.yml`, где такой секции
# не существует: Prometheus отвергает конфиг с неизвестным полем верхнего уровня
# и не стартует. Заметить это было нельзя — стек ни разу не запускали
# (`LEGACY-095`). Здесь они в правильном месте: файл подключён через `rule_files`.
groups:
  - name: books_app_rules
    rules:
      # HTTP request rate per minute
      - record: books_app:http_requests:rate1m
        expr: rate(http_request_duration_seconds_count[1m])

      # HTTP error rate (4xx, 5xx)
      - record: books_app:http_errors:rate1m
        expr: rate(http_request_duration_seconds_count{status_code=~"4..|5.."}[1m])

      # HTTP error ratio (errors / total requests)
      #
      # 🔴 `sum(...)` с обеих сторон — не украшение. Без него деление сопоставляет
      # ряды по совпадающим меткам, а совпадают они только сами с собой: у
      # числителя `status_code="404"`, и знаменатель к нему подбирается тот же
      # самый ряд с тем же `status_code`. Доля выходила ровно **100%** при любой
      # одной ошибке в минуту — и именно 100% стояло во всех ночных сообщениях
      # 17.08.2026. Тот же дефект, что был у гео-правил (см. шапку
      # `alert_rules.test.yml`): синтаксис верный, смысл потерян.
      - record: books_app:http_error_ratio:rate5m
        expr: |
          (
            sum(rate(http_request_duration_seconds_count{status_code=~"4..|5.."}[5m]))
            /
            sum(rate(http_request_duration_seconds_count[5m]))
          ) * 100

      # Доля именно серверных отказов. Заведена отдельно от общей: 4xx — это
      # ответ клиенту (бот перебирает адреса и собирает 404, чужой запрос
      # к `/admin` получает 401), и будить по ней нельзя, а 5xx — это мы.
      - record: books_app:http_server_error_ratio:rate5m
        expr: |
          (
            sum(rate(http_request_duration_seconds_count{status_code=~"5.."}[5m]))
            /
            sum(rate(http_request_duration_seconds_count[5m]))
          ) * 100

      # Объём запросов за то же окно — знаменатель доли отдельным рядом, чтобы
      # правило могло потребовать минимума наблюдений (порог объёма).
      - record: books_app:http_requests:increase5m
        expr: sum(increase(http_request_duration_seconds_count[5m]))

      # P95 response time
      - record: books_app:http_request_duration:p95
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m]))

      # P99 response time
      - record: books_app:http_request_duration:p99
        expr: histogram_quantile(0.99, rate(http_request_duration_seconds_bucket[5m]))

  - name: system_rules
    rules:
      # CPU usage percentage
      - record: node:cpu_usage:rate5m
        expr: |
          100 - (
            avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) by (instance) * 100
          )

      # Memory usage percentage
      - record: node:memory_usage:percentage
        expr: |
          (
            (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) 
            / node_memory_MemTotal_bytes
          ) * 100

      # Disk usage percentage
      - record: node:disk_usage:percentage
        expr: |
          (
            (node_filesystem_size_bytes{fstype!="tmpfs"} - node_filesystem_free_bytes{fstype!="tmpfs"})
            / node_filesystem_size_bytes{fstype!="tmpfs"}
          ) * 100
