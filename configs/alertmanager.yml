# Alertmanager: маршрутизация оповещений.
#
# ⚠️ Внешней доставки пока нет — по решению 10.08.2026 алерты копятся в UI
# (http://127.0.0.1:9093 через SSH-туннель). Это **осознанный компромисс**, а не
# готовое состояние: падение ночью так никто не увидит. Канал (Telegram или
# SMTP) добавляется одним receiver'ом, когда появятся учётные данные.
#
# 🔴 Прежний конфиг подставлял `${SMTP_HOST}`, `${SLACK_WEBHOOK_URL}` и прочие
# переменные окружения. Alertmanager их **не разворачивает** — строки попали бы
# в конфиг буквально, и рассылка молча уходила бы в никуда (или сервис не
# стартовал бы вовсе). Переменных здесь быть не должно.

route:
  group_by: ['alertname', 'service', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'collect-only'
  routes:
    - match:
        severity: critical
      receiver: 'collect-only'
      group_wait: 10s
      repeat_interval: 1h

receivers:
  # Пустой receiver: алерт регистрируется и виден в UI, наружу не уходит.
  - name: 'collect-only'

inhibit_rules:
  # Критическое перекрывает предупреждение о том же самом.
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'service']
