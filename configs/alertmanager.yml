# Alertmanager: маршрутизация оповещений.
#
# Доставка — приватный Telegram-канал (LEGACY-096, 16.08.2026). Один канал на
# оба уровня важности намеренно: два канала на один стек означают, что половину
# сообщений перестают читать. Понадобится развести — critical уходит вторым
# `route` на отдельный receiver, остальное не переписывается.
#
# 🔴 Токена в этом файле нет и быть не может. Alertmanager **не разворачивает**
# переменные окружения: прежний конфиг подставлял `${SMTP_HOST}`,
# `${SLACK_WEBHOOK_URL}` — строки попадали в конфиг буквально, и рассылка молча
# уходила в никуда. Поэтому токен лежит отдельным файлом на сервере, а сюда
# подставляется через `bot_token_file` — тем же приёмом, что `credentials_file`
# в `scrape_configs` файла `configs/prometheus.yml` (номер строки не ставится:
# он уже дважды разъезжался с кодом; связку «ключ → файл» на обеих сторонах
# закрепляет `src/devops/monitoring-wiring.spec.ts`).
#
# ⚠️ Путь `/secrets` — отдельная точка монтирования каталога с секретами **вне
# репозитория**, видимая только этому сервису (`docker-compose.monitoring.yml`,
# LEGACY-226). Каталогом, а не файлом: пофайловый монтаж привязан к inode,
# поэтому заменённый на хосте токен внутри контейнера оставался старым
# до пересоздания — при том что сам файл читается заново на каждой отправке
# (LEGACY-224).
#
# 🔴 Владелец файла с токеном — **uid 65534**, не `deploy`: образ
# `prom/alertmanager` объявляет `USER nobody`, и файл `600`, принадлежащий
# `deploy`, изнутри контейнера не читается вовсе. На сервере: `chown 65534:65534`
# плюс `chmod 400`. Права на хосте — единственное, что теперь решает: конфиг
# лежит в `/cfg`, и `chown -R nobody:nobody /etc/alertmanager` из образа его
# не касается.
# Ошибка здесь не видна снаружи — контейнер здоров, UI зелёный, а канал молчит.
# Единственная проверка, которая её ловит, — дымовая отправка `amtool alert add`.
#
# ⚠️ `bot_token_file` читается при каждой отправке, а не при старте
# (`notify/telegram/telegram.go`, `getBotToken()` вызывается из `Notify`):
# недоступный или пустой файл ломает не запуск сервиса, а молча саму доставку.
# После замены токена проверять дымовым алертом (`amtool alert add`), а логи
# смотреть в `docker logs books-alertmanager` — там `permission denied`,
# `is a directory` или `could not read`. Перевод строки в конце файла безвреден:
# `getBotToken()` применяет `strings.TrimSpace`.
#
# Поле `bot_token_file` поддержано начиная с Alertmanager 0.26.0 (PR #3226,
# запись в CHANGELOG этого же тега); образ пришпилен на `v0.26.0`. Понижать
# версию образа без замены этого поля на `bot_token` нельзя — конфиг не
# загрузится, разбор строгий.

# Ночная тишина (17.08.2026). Владелец спит с полуночи до десяти утра по Еревану
# и отреагировать всё равно не может, а канал за ночь набивался повторами.
#
# 🔴 Это **глушение, а не накопление**. Alertmanager не умеет придержать
# сообщение и отдать пачкой: он либо шлёт, либо молчит. Всё, что вспыхнуло
# и погасло внутри окна, наружу не уйдёт **никогда** — в десять утра придёт
# только то, что горит на этот момент. Осознанный размен: за ночь никто всё
# равно не встаёт, а прогоревшие вспышки видны в UI Alertmanager и в Grafana.
#
# ⚠️ `location` обязателен: без него окно считается по UTC, а это четыре часа
# в сторону — тишина накрыла бы 04:00–14:00 по Еревану, то есть полрабочего дня.
# Поле поддержано с Alertmanager 0.24, образ пришпилен на 0.26.0.
time_intervals:
  - name: night-yerevan
    time_intervals:
      - times:
          - start_time: '00:00'
            end_time: '10:00'
        location: 'Asia/Yerevan'

route:
  group_by: ['alertname', 'service', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'telegram'
  # 🔴 `mute_time_intervals` на корневом маршруте Alertmanager не принимает вовсе:
  # `amtool check-config` отвечает «root route must not have any mute time
  # intervals» и конфиг не грузится. Поэтому доставка целиком вынесена в дочерние
  # маршруты, а корневой оставлен только развилкой; его `receiver` обязателен
  # по схеме, но недостижим — второй дочерний ловит всё, что не critical.
  routes:
    - match:
        severity: critical
      receiver: 'telegram'
      group_wait: 10s
      repeat_interval: 1h
      mute_time_intervals: ['night-yerevan']
    # Ловушка на всё остальное. Без неё warning уходил бы через корневой
    # маршрут, то есть мимо ночного окна — и ночь снова стала бы шумной.
    - receiver: 'telegram'
      mute_time_intervals: ['night-yerevan']

receivers:
  # Пустой receiver: алерт регистрируется и виден в UI, наружу не уходит.
  # Оставлен объявленным намеренно: им глушится канал на время шумного инцидента
  # — достаточно переставить `receiver` в `route`, не трогая остальное.
  - name: 'collect-only'

  - name: 'telegram'
    telegram_configs:
      # `send_resolved` — осознанно: без него приходит «упало» и не приходит
      # «поднялось», и канал копит тревоги, на которые уже не надо реагировать.
      - send_resolved: true
        bot_token_file: /secrets/telegram_token
        chat_id: -1003719761491
        parse_mode: HTML
        # ⚠️ `severity` в заголовке обязателен: два правила носят одно имя
        # `HighMemoryUsage` (critical и warning), без него они неразличимы.
        message: |
          <b>{{ .Status | toUpper }}</b> · {{ .CommonLabels.severity }} · {{ .CommonLabels.alertname }}
          {{ range .Alerts }}{{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}

inhibit_rules:
  # Критическое перекрывает предупреждение о том же самом.
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'service']

  # Правило выше глушит только одноимённые пары, а про отвал гео-источника
  # сообщают два правила с разными именами: при полной пропаже доля неизвестных
  # равна единице, то есть `GeoCountrySourceDegraded` тоже firing. Без этой
  # строки один инцидент даёт два сообщения в канал — warning каждые 4 часа
  # и critical каждый час.
  - source_match:
      alertname: 'GeoCountrySourceUnavailable'
    target_match:
      alertname: 'GeoCountrySourceDegraded'
    equal: ['service']
